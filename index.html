<!DOCTYPE html>
<!--
  ============================================================================
  FLIPBOOK TEMPLATE  —  interactive 3D storybook
  ----------------------------------------------------------------------------
  • No build step, no frameworks. Just open this file in any modern browser.
  • A real 3D hardcover book: thickness, a spine, a soft shadow. Tap PLAY to
    open it (the cover swings on the spine), then flip through the pages.

  ►  TO MAKE YOUR OWN STORY, edit ONLY:
        story.js      → your pages, scenes, dialogues, cover + music
        assets/       → your scene images/videos + cover art
        sfx/          → your background music
     Everything in  engine/  (book design, flip physics, buttons) stays as-is.
     See README.md for the step-by-step.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Glass-half-full-flipbook</title>

<!-- ── Google Fonts: Fredoka (headings) + Poppins (dialogue text — LXD rule)
     + Patrick Hand & Caveat ── -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@500;600;700&family=Patrick+Hand&family=Poppins:wght@600;700&display=swap"
  rel="stylesheet"
/>

<!-- Book styling / theme (engine — do not edit) -->
<link rel="stylesheet" href="engine/styles.css" />

<!-- ══════════════════════════════════════════════════════════════════════════
     PROJECT-LEVEL SCENE OVERRIDE (kept out of engine/ on purpose — to go back
     to the starlit night delete THREE things: this block, the .dust-burst
     markup below, and the drop-sfx <script> at the bottom of <body>).

     THE TABLE SCENE: the closed hardcover lies on a Halloween desk
     (assets/table.png — purple wood, a candle top-left, a spider dangling
     top-right, spellbook corners). A candle-warm glow lifts the centre where
     the book lies and a vignette darkens the desk edges. On load the book
     DROPS onto the table: it starts big (close to the camera), falls away
     ~0.76s, lands with a cartoon squash-and-settle, the floor shadow snaps
     in at impact and a ring of dust puffs bursts from under its edges.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
  /* — the desk — */
  body {
    background:
      radial-gradient(circle at 6% 4%, rgba(255,172,84,0.16), transparent 30%),  /* candle warmth */
      radial-gradient(circle at 50% 46%, rgba(255,196,120,0.10), transparent 56%),/* glow under the book */
      radial-gradient(ellipse at center, rgba(10,3,22,0) 52%, rgba(10,3,22,0.55) 100%), /* vignette */
      url("assets/table.webp") center / cover no-repeat,   /* webp twin of table.png:
                        1917KB → 134KB, the PNG stays as the editable source */
      #241137;
  }
  /* the book lies ON the desk: no idle float, and the generic scene fade-in
     is replaced by the drop itself */
  .book-float { animation: none; }
  .scene      { animation: none; }

  /* cast shadow re-tinted to a deep plum so it reads on the dark wood */
  .floor-shadow {
    background: radial-gradient(ellipse at center, rgba(26,7,40,0.7), rgba(26,7,40,0) 70%);
  }

  /* — the drop — runs once on load, on .book-pop (a free pass-through wrapper:
     the engine never transforms it, so nothing composes against this).
     Top-down camera: "falling onto the desk" = shrinking away from the lens. */
  .book-pop { animation: bookDrop 1150ms both; }
  @keyframes bookDrop {
    0%   { transform: scale(2.35) rotate(-4deg); opacity: 0; animation-timing-function: ease-in; }
    8%   { opacity: 1; animation-timing-function: ease-in; }
    66%  { transform: scale(1) rotate(0deg); animation-timing-function: ease-out; }  /* impact ~760ms */
    74%  { transform: scale(1.05, 0.93); animation-timing-function: ease-in-out; }   /* squash */
    86%  { transform: scale(0.982, 1.012); animation-timing-function: ease-in-out; } /* rebound */
    100% { transform: scale(1); }
  }
  /* the shadow appears with the impact (fill:backwards so the engine's normal
     open/close shadow transitions take over untouched once this ends) */
  .floor-shadow { animation: shadowLand 1150ms ease backwards; }
  @keyframes shadowLand {
    0%   { opacity: 0; width: 26%; }
    56%  { opacity: 0.15; width: 30%; }
    66%  { opacity: 0.95; width: 47%; }   /* impact pulse */
    80%  { opacity: 0.75; width: 44%; }
    100% { opacity: 0.75; width: 44%; }
  }

  /* — the dust — <i> puffs in .dust-burst (markup in .book-stage below),
     positioned in the book's 1280×720 space: --x/--y start point,
     --dx/--dy outward drift (book px), --s size, --j delay jitter.
     They fire at the impact moment (760ms into the drop). */
  .dust-burst { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .dust-burst i {
    position: absolute; left: var(--x); top: var(--y);
    width: calc(var(--s) * 1px); height: calc(var(--s) * 0.7px);
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(246,236,255,0.95), rgba(198,170,234,0.5) 60%, transparent);
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
    filter: blur(2px);
    animation: dustPuff 820ms ease-out calc(760ms + var(--j, 0ms)) both;
  }
  @keyframes dustPuff {
    0%   { opacity: 0;    transform: translate(-50%, -50%) scale(0.5); }
    14%  { opacity: 0.95; }
    55%  { opacity: 0.55; }
    100% { opacity: 0;
           transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))) scale(1.1); }
  }

  /* reduced motion: the book is simply there — no drop, no dust */
  @media (prefers-reduced-motion: reduce) {
    .book-pop, .floor-shadow { animation: none; }
    .dust-burst { display: none; }
  }
</style>
</head>

<body>
<!-- Landscape lock: on phones/tablets (touch), the book shows only in landscape.
     In portrait the scene is hidden and this rotate prompt is shown instead. -->
<div class="rotate-notice" id="rotateNotice">
  <div class="rotate-inner">
    <svg class="rotate-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
    </svg>
    <div class="rotate-text">Please rotate your device<br />to landscape to read</div>
  </div>
</div>
<div class="scene">
  <div class="stage">
    <!-- Fixed 1280×720 book layer. JS scales it (transform) to fit the screen. -->
    <div class="flip-scale" id="flipScale">
    <!-- INNER scale wrapper: the open motion runs here, so it composes with the
         outer responsive scale of .flip-scale. -->
    <div class="book-stage" id="bookStage">
    <!-- Outer hardcover outline — visible once the book is open -->
    <div class="book-frame"></div>
    <div class="floor-shadow"></div>

    <!-- Dust puffs for the book-drop landing (see the scene override in <head>).
         Densest along the bottom edge, a few up the sides, sparse on top. -->
    <div class="dust-burst" aria-hidden="true">
      <!-- Dust hugs the BOTTOM edge (where the book meets the desk — same line
           as the floor shadow): an overlapping cloud of mixed sizes fanning
           outward-down, plus one kick out of each bottom corner. The book's
           page lip overhangs the 1280×720 stage by ~48px, so y≈105-108% sits
           right at the visible silhouette. -->
      <i style="--x:4%;   --y:99%; --dx:-46px; --dy:10px;  --s:78;  --j:20ms"></i>
      <i style="--x:11%;  --y:102%; --dx:-30px; --dy:20px;  --s:100; --j:0ms"></i>
      <i style="--x:20%;  --y:103%; --dx:-18px; --dy:28px;  --s:72;  --j:70ms"></i>
      <i style="--x:30%;  --y:102%; --dx:-10px; --dy:30px;  --s:112; --j:30ms"></i>
      <i style="--x:41%;  --y:104%; --dx:-4px;  --dy:34px;  --s:84;  --j:100ms"></i>
      <i style="--x:50%;  --y:102%; --dx:0px;   --dy:32px;  --s:118; --j:10ms"></i>
      <i style="--x:59%;  --y:104%; --dx:4px;   --dy:34px;  --s:80;  --j:90ms"></i>
      <i style="--x:70%;  --y:102%; --dx:10px;  --dy:30px;  --s:110; --j:40ms"></i>
      <i style="--x:80%;  --y:103%; --dx:18px;  --dy:28px;  --s:74;  --j:80ms"></i>
      <i style="--x:89%;  --y:102%; --dx:30px;  --dy:20px;  --s:102; --j:20ms"></i>
      <i style="--x:96%;  --y:99%; --dx:46px;  --dy:10px;  --s:78;  --j:60ms"></i>
      <i style="--x:-1%;  --y:92%;  --dx:-40px; --dy:-2px;  --s:64;  --j:50ms"></i>
      <i style="--x:101%; --y:92%;  --dx:40px;  --dy:-2px;  --s:64;  --j:40ms"></i>
    </div>

    <!-- The page-turning book mounts here (JS injects one .leaf per page).
         Sits beneath the 3D cover layer; revealed once the cover swings open.
         .page-stack = the tan fore-edge of the pages still to be turned (right). -->
    <div id="flipbook">
      <div class="page-stack" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>

    <!-- Moving shadow the opening cover casts on the inside page. -->
    <div class="cover-cast"></div>

    <!-- The 3D hardcover + cover-opening animation (own perspective layer). -->
    <div class="cover-scene" id="coverScene">
    <div class="book-float" id="bookFloat">
      <div class="book-pop" id="bookPop">
        <div class="book" id="book">
          <div class="book-inner" id="bookInner">

            <!-- Open-book back cover backing -->
            <div class="book-body"></div>

            <!-- The 3D page block that gives the closed book its thickness.
                 pb-pages / pb-back-lip = the flat "book anatomy" of the closed
                 front view: the page stack peeking out UNDER the front cover,
                 resting on the back-cover lip (they fade out as the book opens). -->
            <div class="pageblock">
              <div class="pbf pb-back"></div>
              <div class="pbf pb-left"></div>
              <div class="pbf pb-right"></div>
              <div class="pbf pb-top"></div>
              <div class="pbf pb-bottom"></div>
              <div class="pbf pb-front"></div>
              <div class="pb-back-lip" aria-hidden="true"></div>
              <div class="pb-pages" aria-hidden="true"></div>
            </div>

            <!-- Front hardcover (last so it stacks in front when closed). -->
            <div class="cover-holder">
            <div class="cover" id="cover">
              <div class="face front">
                <div class="cover-img"></div>
                <!-- Ornate GOLD cover frame (corner filigree + edge stars + double
                     rule). One SVG in book-space (1280×720) so it scales crisply
                     with the book — makes the closed cover read as a bound storybook. -->
                <svg class="cover-frame" viewBox="0 0 1280 720" aria-hidden="true">
                  <!-- A single clean thin gold rule — the busy corner filigree,
                       edge stars and brackets were removed to keep the cover
                       uncluttered. It is drawn 11px INSIDE the art window
                       (.cover-img, inset 27px 48px) so it reads as a keyline
                       printed on the artwork, and it starts well right of the
                       38px spine band so the two never collide. -->
                  <rect x="59" y="38" width="1162" height="644" rx="6" fill="none"
                        stroke="#f4d67f" stroke-width="2.2" opacity="0.8"/>
                </svg>
                <div class="back-fill"></div>
                <div class="curl"></div>
                <!-- OPEN THE BOOK: the Play button sits on the cover artwork and
                     tapping it swings the cover open. The artwork comes from
                     story.js (`playButton`) and `playAt` places it, so a new story
                     can drop in its own button over a clear part of its cover. -->
                <button class="play-btn" id="hint" type="button"
                        aria-label="Play — open the book">
                  <img class="play-art" src="assets/wish button.svg" alt="" draggable="false" />
                </button>
              </div>
              <!-- BACK of the front cover: intentionally BLANK (plain dark board). -->
              <div class="face back"></div>
            </div>
            </div><!-- /cover-holder -->

          </div>
        </div>
      </div>
    </div>
    </div><!-- /cover-scene -->

    <!-- Flat, top-most, transparent tap zone that only OPENS the book. -->
    <div class="tap-catcher" id="tapCatcher"></div>

    <!-- (THE END is now a real final PAGE — the last leaf, built by script.js:
         a cream "paper" page with "THE END" + a Replay button. Replay closes the
         whole book, reverse of the opening swing, back to the front cover.) -->
    </div><!-- /book-stage -->
    </div><!-- /flip-scale -->
  </div>
</div>

<!-- Flip arrows OUTSIDE the book, fixed at the viewport's bottom corners
     (bottom-left = back, bottom-right = forward). -->
<button class="corner-arrow back" id="cornerPrev" aria-label="Previous page">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <path d="M46 19 L30 5 L30 12 C20 11 11 15 6 30 L12 33 C18 24 22 24 30 24 L30 33 Z" fill="currentColor"/>
  </svg>
</button>
<button class="corner-arrow fwd" id="cornerNext" aria-label="Next page">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <path d="M46 19 L30 5 L30 12 C20 11 11 15 6 30 L12 33 C18 24 22 24 30 24 L30 33 Z" fill="currentColor"/>
  </svg>
</button>

<!-- GSAP (local copy, works on file://) — drives the physical page-flip motion:
     lift → gravity fall → tiny landing bounce. If this file fails to load, the
     book automatically falls back to the original CSS-transition flip. -->
<script src="engine/gsap.min.js"></script>
<!-- Inlined one-shot SFX (base64) for glitch-free Web Audio playback on file:// -->
<script src="engine/sfx-data.js"></script>
<!-- ►  YOUR STORY (pages, dialogues, cover, music) — edit this file -->
<script src="story.js"></script>
<!-- The flip engine (reads window.STORY) — do not edit -->
<script src="engine/script.js"></script>

<!-- Part of the TABLE SCENE (see the <style> block in <head>): a soft thud the
     moment the book lands, so the drop has weight instead of being silent.
     Synthesized with Web Audio — no asset, nothing to load, and it costs the
     book nothing if it never plays. Two honest limits:
       • browsers refuse audio before the reader has interacted with the page,
         and the drop happens on load — so on a first visit this is usually
         SILENT. It plays on revisits and wherever the browser allows it. There
         is no way around that without holding the entrance until a tap.
       • reduced-motion readers get no drop, so they get no thud either. -->
<script>
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var IMPACT_MS = 760;                       // the landing frame of bookDrop
  setTimeout(function () {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      var ctx = new AC();
      if (ctx.state === "suspended" && ctx.resume) ctx.resume();
      if (ctx.state === "suspended") { ctx.close && ctx.close(); return; }   // blocked → stay quiet
      var t = ctx.currentTime;
      // body of the thud — a low sine dropping in pitch, like a hardcover
      // hitting wood; kept soft (0.3) so it sits under the music, not over it
      var osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(155, t);
      osc.frequency.exponentialRampToValueAtTime(46, t + 0.19);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.36);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.38);
      // and the dust: a short puff of low-passed noise, fading as it settles
      var len = Math.floor(ctx.sampleRate * 0.24);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var n = ctx.createBufferSource(); n.buffer = buf;
      var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1300;
      var ng = ctx.createGain();
      ng.gain.setValueAtTime(0.1, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      n.connect(lp); lp.connect(ng); ng.connect(ctx.destination);
      n.start(t); n.stop(t + 0.26);
      setTimeout(function () { try { ctx.close(); } catch (e) {} }, 1200);
    } catch (e) { /* no audio here — the drop just plays silently */ }
  }, IMPACT_MS);
})();
</script>

<!-- ⚠ DEV ONLY — page-jump hamburger for testing. DELETE THIS ONE LINE and the
     dev/ folder to remove it completely; it touches nothing else. -->
<script src="dev/dev-menu.js"></script>
</body>
</html>
