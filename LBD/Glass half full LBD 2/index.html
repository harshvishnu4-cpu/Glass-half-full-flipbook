<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>The Glass Half Full</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥤</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <!-- Scene layers (exported from Figma, WebP) -->
      <img class="layer" id="bg"     src="assets/img/bg.webp"        alt="">
      <img class="layer" id="ground" src="assets/img/ground.webp"    alt="">
      <img class="layer" id="trays"  src="assets/img/trays.webp"     alt="">

      <!-- Phase 2: spooky customers & serving counter (hidden until sorting is done) -->
      <div id="customer-layer">
        <img class="customer" id="char-reaper"  src="assets/img/char-reaper.webp"  alt="Little reaper customer">
        <img class="customer" id="char-wolf"    src="assets/img/char-wolf.webp"    alt="Wolf customer">
        <img class="customer" id="char-mummy"   src="assets/img/char-mummy.webp"   alt="Mummy customer">
        <img class="customer" id="char-vampire" src="assets/img/char-vampire.webp" alt="Vampire customer">
        <img class="customer" id="char-zombie"  src="assets/img/char-zombie.webp"  alt="Zombie customer">
      </div>
      <img class="layer phase2" id="trays2"   src="assets/img/trays2.webp"   alt="">
      <img class="layer phase2" id="lemonbox" src="assets/img/lemonbox.webp" alt="">
      <img class="layer phase2" id="strawbox" src="assets/img/strawbox.webp" alt="">

      <div id="sky-sparkles"></div>

      <!-- per-tray highlight art: the same trays cut out with alpha, laid
           exactly over the scene layer so the tutorial hint can glow along
           each tray's real silhouette (hidden until a hint calls for it) -->
      <img class="tray-glow" id="glow-empty" src="assets/img/tray-empty.webp" alt="">
      <img class="tray-glow" id="glow-half"  src="assets/img/tray-half.webp"  alt="">
      <img class="tray-glow" id="glow-full"  src="assets/img/tray-full.webp"  alt="">

      <!-- Drop zones (invisible; glow while a glass hovers over them) -->
      <div class="tray-zone" id="zone-empty" data-type="empty"></div>
      <div class="tray-zone" id="zone-half"  data-type="half"></div>
      <div class="tray-zone" id="zone-full"  data-type="full"></div>
      <div class="tray-zone" id="zone-customer"></div>

      <div id="glass-layer"></div>

      <!-- Gold plaques (level 1 only — level 2's serving trays carry none) -->
      <div class="plaque" id="plaque-empty"><span>Empty</span></div>
      <div class="plaque" id="plaque-half"><span>Half</span></div>
      <div class="plaque" id="plaque-full"><span>Full</span></div>

      <img id="demand-bubble" src="assets/img/bubble-half.svg" alt="Customer order">
      <div id="serve-bubble"></div>

      <!-- Agni peeks in from the left and speaks every line of guidance
           through his bubble (Figma node 670:1298) -->
      <div id="agni">
        <img id="agni-img" src="assets/img/agni-peek.webp" alt="Agni the dragon">
        <div id="agni-bubble"><span id="agni-text"></span></div>
      </div>

      <div id="fx-layer"></div>

      <!-- end / success screen: the celebration plays once, then the game
           returns to the title screen (whose Play button restarts the game).
           preload="none": the preloader fetches the video, so the element
           must not download it a second time -->
      <div id="win-overlay">
        <video id="win-bg" src="assets/img/endscreen.webm" poster="assets/img/endscreen.webp"
               playsinline preload="none" aria-label="Sold out! You served every customer."></video>
      </div>

      <!-- title screen (Spooky Rush logo art); the Play button stays hidden
           behind the juice loading bar until every asset is fetched -->
      <div id="title-screen">
        <img id="title-bg" src="assets/img/title.webp" alt="Spooky Rush">
        <div id="load-wrap" aria-hidden="true">
          <div id="load-bar"><div id="load-fill"></div></div>
          <span id="load-txt">Pouring the juice… 0%</span>
        </div>
        <button id="play-btn" aria-label="Play"><img src="assets/img/playbutton.webp" alt="Play"></button>
      </div>

      <!-- liquid splash transition: a juice blob bursts from the center to
           cover the screen (with flying droplets), then drains off the
           bottom behind the drippy wave sheets -->
      <div id="splash">
        <img id="splat" src="assets/img/splash.webp" alt="">
        <div class="wave wave-back">
          <svg viewBox="0 0 1920 1900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path fill="#b8156f" d="M0 150 Q240 70 480 140 T960 120 T1440 150 T1920 110 L1920 1560 Q1800 1680 1680 1590 T1440 1600 T1200 1580 T960 1620 T720 1580 T480 1620 T240 1580 L0 1620 Z"/>
          </svg>
        </div>
        <div class="wave wave-front">
          <svg viewBox="0 0 1920 1900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path fill="#F77ADE" d="M0 130 Q160 50 320 115 T640 95 T960 130 T1280 90 T1600 125 T1920 105 L1920 1520 Q1848 1660 1776 1568 Q1704 1500 1632 1552 Q1560 1710 1488 1580 Q1416 1504 1344 1548 Q1272 1672 1200 1560 Q1128 1502 1056 1546 Q984 1706 912 1576 Q840 1506 768 1548 Q696 1668 624 1556 Q552 1500 480 1544 Q408 1700 336 1572 Q264 1508 192 1550 Q120 1662 48 1560 L0 1600 Z"/>
            <g fill="#F77ADE">
              <circle cx="300" cy="1750" r="18"/><circle cx="760" cy="1800" r="14"/><circle cx="1180" cy="1760" r="20"/>
              <circle cx="1560" cy="1820" r="12"/><circle cx="960" cy="1850" r="16"/><circle cx="90" cy="1720" r="10"/>
              <circle cx="1830" cy="1770" r="15"/><circle cx="520" cy="1730" r="11"/>
            </g>
            <g fill="#ff9edd" opacity="0.55">
              <circle cx="420" cy="380" r="22"/><circle cx="980" cy="460" r="26"/><circle cx="1560" cy="400" r="18"/>
              <circle cx="700" cy="820" r="24"/><circle cx="1280" cy="900" r="20"/>
              <circle cx="260" cy="1200" r="16"/><circle cx="1130" cy="1300" r="14"/><circle cx="1700" cy="1150" r="17"/>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- shown on portrait phones: the game is designed for landscape -->
  <div id="rotate-overlay">
    <div id="rotate-inner">
      <div id="rotate-icon">📱</div>
      <p>Please rotate your device<br>to play!</p>
    </div>
  </div>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/preload-manifest.js"></script>
  <script src="js/preload.js"></script>
  <script src="js/game.js"></script>

  <!-- ── GO FULLSCREEN ON PLAY ─────────────────────────────────────────────────
       The flipbook hosts this game in an iframe the size of one book page, which
       is a small window for a drag-and-drop game. Tapping Play now asks for
       fullscreen so it fills the screen instead.
       It has to be requested HERE, from inside the game: the request needs the
       user gesture in the document that makes it, and a click in this iframe
       never reaches the book. The book's side is `allow="fullscreen"`.
       A SEPARATE listener, deliberately — game.js's own #play-btn handler is
       untouched, so if fullscreen is refused (iOS Safari does not allow it on a
       non-video element) the game still starts exactly as before. Standalone,
       this simply makes Play fullscreen the page, which is no worse.        -->
  <script>
  (function () {
    // Report in, so the book can tell a LOADED game from a missing one. A frame
    // whose document 404s still fires `load` and is cross-origin, so the book has
    // nothing to inspect — silence here is what makes it show its own notice
    // instead of a blank page.
    if (window.parent !== window) {
      try { window.parent.postMessage({ source: 'lbd', type: 'ready' }, '*'); } catch (e) {}
    }
    var btn = document.getElementById('play-btn');
    if (!btn) return;

    function goFullscreen() {
      var el = document.documentElement;
      var go = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (!go || document.fullscreenElement || document.webkitFullscreenElement) return;
      // Only bother if the switch CAN happen. fullscreenEnabled is false inside a
      // file:// frame (opaque origin → permission denied) and true over http, so on
      // a double-clicked book this was asking the book for a full-screen pink mask
      // that hid nothing — a pink flash across the desk for no gain. Windowed, the
      // game's own wipe is seamless on its own. (!== false so a browser missing the
      // property still tries.)
      if (document.fullscreenEnabled === false) return;
      // Ask the book to paint the same pink over the WHOLE screen first, and WAIT
      // for it to confirm. The wipe only covers this frame; the frame growing from
      // a page-sized box to the screen is plainly visible around it unless
      // everything else is already the same colour. Posting and switching in the
      // same breath gave the mask under one frame, so it never actually showed.
      var went = false;
      function go2() {
        if (went) return;
        went = true;
        // The splat is sized to the CURRENT viewport, so after the switch it no
        // longer reaches the enlarged corners and the page background shows there
        // — which is what made the change noticeable. Paint the page itself the
        // same pink for the duration of the wipe: it sits behind everything, so
        // the drain still reveals the scene, but the corners are pink meanwhile.
        var prev = el.style.background;
        el.style.background = '#F77ADE';
        setTimeout(function () { el.style.background = prev; }, 2600);
        // Report the outcome EITHER WAY so the book clears its pink mask as soon
        // as the switch has settled, rather than on a fixed timer that outlived a
        // refused switch and sat over the wipe's reveal.
        var settled = function () {
          try { if (window.parent !== window)
            window.parent.postMessage({ source: 'lbd', type: 'switched' }, '*'); } catch (e2) {}
        };
        try {
          var p = go.call(el, { navigationUI: 'hide' });
          if (p && p.then) p.then(settled, settled); else settled();
        } catch (e) { settled(); }
      }
      if (window.parent === window) { go2(); return; } // not framed → nothing to mask
      window.addEventListener('message', function onMsg(ev) {
        if (!ev.data || ev.data.source !== 'book' || ev.data.type !== 'masked') return;
        window.removeEventListener('message', onMsg);
        go2();
      });
      try { window.parent.postMessage({ source: 'lbd', type: 'covered' }, '*'); } catch (e) {}
      setTimeout(go2, 700);                              // no ack → go regardless
    }

    // SWITCH WHILE THE SPLASH COVERS THE SCREEN, so the resize is never seen.
    // Doing it on the tap meant watching the viewport jump before the transition;
    // doing it here hides it inside the transition, which is what a wipe is for.
    //
    // The moment to use is game.js's `midFn`, at the top of splashTransition's
    // timeline: the juice splat has scaled to 3.8 and swallowed the whole screen,
    // and only then does it hide the title screen and set the scene up. That is
    // observable from out here without touching game.js — `#title-screen` getting
    // `display: none` IS that instant.
    //
    // It lands ~1.2s after the tap (0.25s delayedCall + ~0.92s of splat), which is
    // well inside Chromium's ~5s transient activation window, so the request is
    // still treated as user-initiated. Verified, because that is the whole premise.
    var title = document.getElementById('title-screen');
    var armed = false, done = false;
    function armSwitch() {
      if (armed) return;
      armed = true;
      if (!title) { goFullscreen(); return; }        // no title screen → just switch
      var obs = new MutationObserver(function () {
        if (done) return;
        if (getComputedStyle(title).display !== 'none') return;
        done = true;
        obs.disconnect();
        goFullscreen();                              // hidden behind the splat
      });
      obs.observe(title, { attributes: true, attributeFilter: ['style', 'class'] });
      // If the splash never runs (a future change, or a start path that skips it),
      // switch anyway rather than never going fullscreen at all.
      setTimeout(function () {
        if (done) return;
        done = true; obs.disconnect(); goFullscreen();
      }, 2500);
    }
    btn.addEventListener('pointerdown', armSwitch);
    // Keyboard (Enter/Space) produces a click with no pointerdown — cover it too.
    btn.addEventListener('click', armSwitch);

    // ── TELL THE BOOK WHEN THE GAME ENDS ─────────────────────────────────────
    // Hosted in the flipbook, this game is a page. When the win overlay comes up
    // the reader has finished, so the book is told and answers by playing its
    // page-turn cue and letting the page be dragged.
    // Watched from out here — `#win-overlay` becoming visible IS the finale —
    // so game.js is untouched. This game never leaves that screen ("nothing
    // navigates away and there is no replay button"), so there is no restart to
    // report, unlike LBD 1.
    if (window.parent !== window) {
      var win = document.getElementById('win-overlay');
      if (win) {
        var told = false;
        var check = function () {
          if (told) return;
          var cs = getComputedStyle(win);
          if (cs.visibility === 'hidden' || +cs.opacity < 0.5) return;
          told = true;
          try { window.parent.postMessage({ source: 'lbd', type: 'end' }, '*'); } catch (e) {}
        };
        // GSAP animates inline style, so attribute mutations catch it; the poll is
        // the belt to that braces in case a future change tweens a class instead.
        new MutationObserver(check).observe(win, { attributes: true, attributeFilter: ['style', 'class'] });
        var poll = setInterval(function () { check(); if (told) clearInterval(poll); }, 400);
        // And report again when the celebration has finished playing (4.02s). The
        // book holds off leaving fullscreen until then, so the reward is watched
        // full size; only once there is nothing left to watch does it shrink back
        // into the page and invite the reader to turn on. The last frame stays up.
        var winVid = document.getElementById('win-bg');
        if (winVid) winVid.addEventListener('ended', function () {
          try { window.parent.postMessage({ source: 'lbd', type: 'endDone' }, '*'); } catch (e) {}
        });
      }
    }

      // ── HAND THE READER BACK TO THE BOOK ───────────────────────────────────
      // The book asks for this once the celebration has finished playing. Exiting
      // must happen HERE: fullscreen was requested on this document's own
      // documentElement, so the element lives inside this frame and only this
      // document can release it cleanly — the book calling exitFullscreen() from
      // outside shrank the frame but left its own document.fullscreenElement still
      // pointing at the iframe. Answer `left` either way so the book stops waiting.
      window.addEventListener('message', function (ev) {
        if (!ev.data || ev.data.source !== 'book' || ev.data.type !== 'leave') return;
        var reply = function () {
          try { window.parent.postMessage({ source: 'lbd', type: 'left' }, '*'); } catch (e) {}
        };
        var ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) { reply(); return; }
        if (!ex) { reply(); return; }
        try {
          var q = ex.call(document);
          if (q && q.then) q.then(reply, reply); else setTimeout(reply, 120);
        } catch (e) { reply(); }
      });

  })();
  </script>
</body>
</html>
