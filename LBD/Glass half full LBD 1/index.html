    { transform: 'translateX(-48%) rotate(2deg)'  },
    { transform: 'translateX(-50%) rotate(0deg)'  }
  ], { duration: 460, easing: 'ease-in-out' });
}
// shake ONLY the customer the glass is actually dropped on (a wrong customer).
// Test the glass centre, not the cursor (the glass trails the pointer by the grab
// offset). If the glass lands on no customer at all — empty table, a box, any other
// object — nothing shakes.
function shakeCustomerAt() {
  if (!servedSet) return;
  const g = servedSet.getBoundingClientRect();
  const gx = g.left + g.width / 2, gy = g.top + g.height / 2;
  for (let i = 0; i < queue.length; i++) {
    const el = LANES[queue[i].lane].el;
    const b = el.getBoundingClientRect();
    if (gx >= b.left && gx <= b.right && gy >= b.top && gy <= b.bottom) { shakeEl(el); return; }
  }
}

// drop the finished drink onto the active (first-in-line) customer
let wrongDropCount = 0;   // consecutive wrong drops → after 2, show the ghost drag hint
function dropOnPair(e) {
  const active = activeCustomer();   // the front of the line — the only one being served
  if (!active) { servedSet.style.transition = 'transform 0.3s ease'; servedSet.style.transform = 'translate(0,0)'; return; }
  const r = LANES[active.lane].el.getBoundingClientRect();
  // test where the GLASS is (its centre), not the cursor — the glass trails the pointer
  // by the grab offset, so a cursor-based test wrongly rejects glasses placed on the customer
  const g = servedSet.getBoundingClientRect();
  const gx = g.left + g.width / 2, gy = g.top + g.height / 2;
  const over = gx >= r.left && gx <= r.right && gy >= r.top && gy <= r.bottom;
  if (over) { wrongDropCount = 0; serveCustomer(active); return; }   // correct target → serve, no shake
  // ── WRONG drop (off the active customer) ──
  cancelDragIdleNudge();            // they interacted — clear any showing ghost
  try { jumpSound.currentTime = 0; jumpSound.play().catch(() => {}); } catch (err) {}   // wrong-drop sound
  shakeCustomerAt();                // only shakes if the glass landed on a wrong customer
  // dropped off the customer → snap back with a gentle wiggle, stay draggable so they can aim again
  servedSet.classList.add('wrongDrop');
  servedSet.style.transition = 'transform 0.3s ease';
  servedSet.style.transform  = 'translate(0,0)';
  const s = servedSet;
  setTimeout(() => {                                  // after the snap home, do the wiggle
    if (!s || s !== servedSet) return;
    s.style.transition = '';
    s.classList.add('wiggle');
    setTimeout(() => {
      if (!s || s !== servedSet) return;
      s.classList.remove('wiggle', 'wrongDrop');
      s.classList.add('hintBob');    // back to idle hover
      armDragIdleNudge();            // idle again ~9s → the ghost hint returns
    }, 520);
  }, 300);
}

// the made drink matches no remaining client → fade it out and reset for a fresh pour
function discardDrinkAndRepour() {
  playWrongSound();
  if (servedSet) servedSet.classList.add('wrongDrop');
  cancelBoxIdleNudge();
  cancelDragIdleNudge();
  setTimeout(() => {
    if (servedSet) { servedSet.remove(); servedSet = null; }
    strawBox.classList.remove('glow'); strawBox.style.pointerEvents = 'none';
    lemonBox.classList.remove('glow'); lemonBox.style.pointerEvents = 'none';
    strawAdded = false; lemonAdded = false; servedLevel = null;
    fillPct = 0; setJuice(0); hasPoured = false; phase = 'play';
    checkBtn.style.display = 'none'; checkBtn.disabled = true;
    allowPour(); armPourNudge();   // customer mode: nudge only after ~11s idle
  }, 600);
}

// ── coin reward timeline ──────────────────────────────────────
// The visual and the sound are driven off these three numbers, so they cannot drift apart.
// HOLD/FADE must match the CSS: #coinPile.landIn is coinLand 0.45s, .fadeOut is coinFade 0.7s.
const COIN = {
  HOLD: 900,      // pile sits on the counter once it has materialised
  FADE: 700,      // coinFade: floats up and dissolves — invisible at HOLD + FADE
  LEAD_IN: 0.25   // measured dead air at the top of cash-register..ogg
};
// The cash-register chink, fitted to that timeline:
//  • the file opens with 0.25s of digital silence. Skipping it puts the chink on the frame the
//    coins materialise, instead of a quarter second after them.
//  • the volume then rides the pile's dissolve: the fade starts the moment coinFade does and
//    reaches silence exactly as the pile goes invisible, so the tail disappears WITH the coins.
//  • at that point it is stopped and rewound. The file runs 2.23s and is still audible at
//    2.03s, so played straight through it carried on ~0.4s after the coins had gone.
// Ticks are counted rather than clock-timed, so a pause mid-fade resumes where it left off
// instead of jumping to silence.
function playCoinSfx() {
  const s = serveSound;
  if (!s) return;
  if (s._fade) { clearInterval(s._fade); s._fade = null; }   // a second reward restarts cleanly
  if (s._stop) { clearTimeout(s._stop); s._stop = null; }
  try {
    s.volume = COIN_SFX_VOL;
    s.currentTime = COIN.LEAD_IN;
    s.play().catch(() => {});
  } catch (e) { return; }
  const STEP = 40, steps = Math.max(1, Math.round(COIN.FADE / STEP));
  s._stop = setTimeout(() => {                               // pile starts dissolving → fade out
    let i = 0;
    s._fade = setInterval(() => {
      i++;
      s.volume = Math.max(0, COIN_SFX_VOL * (1 - i / steps));
      if (i >= steps) {                                      // pile is invisible → silence, fully
        clearInterval(s._fade); s._fade = null;
        try { s.pause(); s.currentTime = COIN.LEAD_IN; } catch (e) {}
        s.volume = COIN_SFX_VOL;                             // armed for the next reward
      }
    }, STEP);
  }, COIN.HOLD);
}

// coin reward: the coins.svg pile magically appears on the counter in front of the
// served customer, holds ~2 seconds, then fades out smoothly.
function rewardCoins(fromEl) {
  const pile = document.getElementById('coinPile');
  if (!pile) return;
  // fixed spot on the counter ledge (position/size come from CSS — matches the reference)
  clearTimeout(pile._hold); clearTimeout(pile._gone);
  pile.classList.remove('fadeOut');
  pile.style.display = 'block';
  void pile.offsetWidth;
  pile.classList.add('landIn');                     // magical materialise
  playCoinSfx();                                    // sfx starts on this frame and ends with the pile
  pile._hold = setTimeout(() => {                   // hold ~0.9 seconds…
    pile.classList.remove('landIn');
    pile.classList.add('fadeOut');                  // …then smooth magical fade-out (no sfx)
    pile._gone = setTimeout(() => {
      pile.style.display = 'none'; pile.classList.remove('fadeOut');
      showMachineGlass();                           // coins gone → a fresh glass appears in the machine
    }, COIN.FADE + 20);
  }, COIN.HOLD);
}

// the delivered drink flies up to the customer's mouth, tilts to "drink", then vanishes
function playDrinkAnim(drink, customerEl) {
  if (!drink) return;
  drink.removeEventListener('pointerdown', onServeDown);
  drink.classList.remove('hintBob', 'draggable');
  drink.style.transition = 'none';
  const prev = drink.style.transform || 'translate(0px, 0px)';   // the drop position (from dragging)

  // work out the translate that brings the glass up to the customer's mouth/face
  let mouth = prev;
  if (customerEl) {
    const gr = gcEl.getBoundingClientRect();
    const m  = /translate\(\s*([-\d.]+)px\s*,\s*([-\d.]+)px\s*\)/.exec(prev);
    const tx = m ? parseFloat(m[1]) : 0, ty = m ? parseFloat(m[2]) : 0;
    const cur = drink.getBoundingClientRect();                    // current (dropped) position
    const restCx  = cur.left + cur.width / 2 - gr.left - tx;      // glass centre at rest (no transform)
    const restTop = cur.top - gr.top - ty;
    const cr = customerEl.getBoundingClientRect();
    const targetCx = cr.left + cr.width / 2 - gr.left;            // customer centre-x
    const targetY  = cr.top - gr.top + cr.height * 0.28;          // mouth/face height on the sprite
    mouth = 'translate(' + (targetCx - restCx).toFixed(0) + 'px,' + (targetY - restTop).toFixed(0) + 'px)';
  }

  drink.animate([
    { transform: prev  + ' rotate(0deg) scale(1)',                        opacity: 1, offset: 0    },
    { transform: mouth + ' rotate(0deg) scale(0.8)',                      opacity: 1, offset: 0.32 },  // flew up to the mouth (smaller)
    { transform: mouth + ' translateY(-5%) rotate(-26deg) scale(0.8)',    opacity: 1, offset: 0.60 },  // tilt back to drink
    { transform: mouth + ' translateY(-7%) rotate(-30deg) scale(0.8)',    opacity: 1, offset: 0.82 },
    { transform: mouth + ' translateY(-10%) rotate(-34deg) scale(0.45)',  opacity: 0, offset: 1  }     // emptied → gone
  ], { duration: 1050, easing: 'ease-in-out', fill: 'forwards' });
  setTimeout(() => { if (drink) drink.remove(); }, 1080);   // gone once emptied
}

// the front customer got their juice → drink, cheer, walk off; the line shifts forward
function serveCustomer(c) {
  if (c !== queue[0]) return;                          // only the front is ever served
  hideHand();
  cancelDragIdleNudge();
  c.served = true;
  const L = LANES[c.lane];
  const fb = document.getElementById(L.bubbleId);
  if (fb) fb.classList.remove('show');                 // order fulfilled — bubble away

  // hand over the drink → it flies to the customer's mouth, they drink, glass disappears
  const el = L.el, leftLane = c.lane;
  // (the cash-register sfx plays later, in rewardCoins, in sync with the pile appearing)
  playDrinkAnim(servedSet, el);
  servedSet = null;
  try { coinsGoneSound.currentTime = 0; coinsGoneSound.play().catch(() => {}); } catch (e) {}   // delivery sfx
  busyLanes.push(leftLane);
  // reset the finishing boxes; lock the bar for the whole serve → exit beat
  strawBox.classList.remove('glow'); strawBox.style.pointerEvents = 'none';
  lemonBox.classList.remove('glow'); lemonBox.style.pointerEvents = 'none';
  strawAdded = false; lemonAdded = false; servedLevel = null;
  checkBtn.style.display = 'none'; checkBtn.disabled = true;
  pourBtn.disabled = true;
  phase = 'leaving';

  // full sequence, in order: drink → cheer + coins → walk off → ONLY THEN advance the
  // line. The served customer stays in the queue (holding its lane) until it has fully
  // exited, so the next customer never moves into / overlaps the serving spot.
  setTimeout(() => {                                   // drink finished (~1.05s) → cheer + coins
    el.classList.remove('cheer'); void el.offsetWidth; el.classList.add('cheer');
    rewardCoins(el);                                   // coins appear on the counter in front of the customer
    setTimeout(() => {                                 // then walk off to the left
      el.classList.remove('standing', 'arriving', 'cheer'); void el.offsetWidth;
      el.classList.add('leavingLeft');                 // walk off-screen left
      setTimeout(() => {                               // fully off-screen → free the lane, THEN advance
        el.style.display = 'none'; el.classList.remove('leavingLeft');
        const bi = busyLanes.indexOf(leftLane); if (bi !== -1) busyLanes.splice(bi, 1);

        queue.shift();                                 // remove the served front now that it has gone
        repositionQueue();                             // the rest slide forward into the empty spots

        // all customers served and none left to spawn → the cycle is complete
        if (qIndex >= customerOrder.length && queue.length === 0) {
          phase = 'gameover';
          setTimeout(endGame, 1100);
          return;
        }
        // the new front steps up → open its order box and re-enable pouring
        setTimeout(() => {
          fillPct = 0; setJuice(0); hasPoured = false; phase = 'play';
          refreshActive();                 // the new front opens its dialogue box
          allowPour(); armPourNudge();   // nudge only after ~11s idle
        }, 750);
      }, 1000);
    }, 500);
  }, 1050);
}

// ── end-screen confetti (carnival colours, rains over the celebration video) ──
const CONFETTI_COLORS = ['#FF7ED8', '#CE9EFF', '#FFD84D', '#7FE0FF', '#FF9E5A', '#FFFFFF', '#8BE78B'];
let confettiTimer = null;
let endWatchdog = null;      // safety net that freezes the end video if 'ended' never fires
let endFrozen = false;       // true once the end video is parked on its final frame
// When to swap the end screen in behind the splash wipe: the splat finishes swallowing the
// board at TRANS.BURST (700ms) and the waves only start draining at TRANS.DRAIN_AT (1040ms),
// so anywhere in between is fully covered. 820ms sits comfortably in that window.
const SPLASH_COVER_AT = 820;
function makeConfettiPiece() {
  const box = document.getElementById('confetti');
  if (!box) return;
  const p = document.createElement('div');
  p.className = 'confettiPiece';
  const w = 0.7 + Math.random() * 0.9;                 // % width
  p.style.width = w + '%';
  p.style.left = (Math.random() * 100) + '%';
  p.style.background = CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0];
  p.style.borderRadius = (Math.random() < 0.4) ? '50%' : '2px';   // mix of dots and flakes
  p.style.setProperty('--dx', ((Math.random() * 2 - 1) * 90).toFixed(0) + 'px');   // gentle sway
  const dur = 2.6 + Math.random() * 2.2;
  p.style.animationDuration = dur.toFixed(2) + 's';
  box.appendChild(p);
  setTimeout(() => p.remove(), dur * 1000 + 120);
}
function startConfetti() {
  stopConfetti();
  for (let i = 0; i < 40; i++) setTimeout(makeConfettiPiece, Math.random() * 700);   // opening burst
  confettiTimer = setInterval(() => { for (let i = 0; i < 6; i++) makeConfettiPiece(); }, 320);   // steady rain
}
function stopConfetti() {
  if (confettiTimer) { clearInterval(confettiTimer); confettiTimer = null; }
  const box = document.getElementById('confetti');
  if (box) box.innerHTML = '';
}

// every customer has had their half + full visit → show the end screen
function endGame() {
  phase = 'gameover';
  pairMode = false;
  if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
  queue = []; busyLanes = [];
  pourBtn.disabled = true;
  checkBtn.style.display = 'none'; checkBtn.disabled = true;
  hideHand();
  if (bannerEl) bannerEl.classList.remove('show');
  clearServed();
  LANES.forEach(l => { l.el.style.display = 'none'; const b = document.getElementById(l.bubbleId); if (b) b.classList.remove('show'); });
  const end = document.getElementById('gameEnd');

  // Play the celebration video ONCE and hold it on its final frame. It used to jump straight
  // back to the title when 'ended' fired; now the last frame stays on screen as the completion
  // card and waits for a tap (see the #gameEnd handler under restartGame).
  // Runs from the transition below — never straight off the last serve.
  function startCelebration() {
  startConfetti();                                   // celebratory confetti over the video
  stopGameMusic();                                   // the video has its own audio
  const v = document.getElementById('endVideo');
  endFrozen = false;
  if (v) {
    v.loop = false;                                  // explicit: never repeat, never replay
    v.currentTime = 0;
    if (endWatchdog) { clearTimeout(endWatchdog); endWatchdog = null; }
    // playback is over → settle on the frame that is already painted. pause() is all it takes:
    // after 'ended' the element keeps showing the last frame, and there is no poster to fall
    // back to, so currentTime is deliberately left alone — seeking here would only risk a
    // visible flash. Nothing re-arms playback afterwards.
    const freeze = () => {
      if (endWatchdog) { clearTimeout(endWatchdog); endWatchdog = null; }
      v.onended = null; v.onloadedmetadata = null;
      try { v.pause(); } catch (e) {}
      endFrozen = true;                              // …and a tap may now leave the end screen
      // the celebration is over: stop spawning confetti (pieces already falling finish their
      // fall and remove themselves). Without this the spawner would run for as long as the
      // card is up — it used to stop here too, when this moment returned to the title.
      if (confettiTimer) { clearInterval(confettiTimer); confettiTimer = null; }
    };
    const armWatchdog = () => {                      // re-armed once the duration is known
      if (endWatchdog) clearTimeout(endWatchdog);
      const dur = (isFinite(v.duration) && v.duration > 0) ? v.duration : 5;
      endWatchdog = setTimeout(freeze, dur * 1000 + 3000);   // 'ended' never arrived → freeze anyway
    };
    v.onloadedmetadata = armWatchdog;
    armWatchdog();                                   // covers metadata never arriving
    v.onended = freeze;
    v.onerror = () => setTimeout(restartGame, 1500); // video missing/broken → still reach the title
    const p = v.play();
    if (p) p.catch(() => {                           // autoplay-with-sound blocked → retry muted
      if (endFrozen) return;                         // already parked on the final frame: a play()
                                                     // promise that rejects this late must never
                                                     // start the clip up again
      v.muted = true;
      v.play().catch(() => setTimeout(restartGame, 1500));
    });
  } else {
    setTimeout(restartGame, 1500);
  }
  }  // ── end startCelebration ──

  // ── the transition: the same juice-splash wipe the tutorial ends with ──
  // playSplashTransition() bursts the pink splat out to swallow the board, slides two waves in
  // behind it, holds at full cover, then drains them away to reveal whatever is underneath —
  // and it brings its own sfx, fitted to that timeline. Reused here verbatim, so the end of the
  // game reads exactly like the end of the tutorial.
  //   • the end screen is swapped in at SPLASH_COVER_AT, while the splat has the board
  //     completely covered — the switch itself is never visible, no cut, no blank frame
  //   • the celebration starts as the waves BEGIN to drain, so the video is already alive as it
  //     is revealed, the way the tutorial's wipe reveals a live scene rather than a still
  playSplashTransition();
  setTimeout(() => { if (end) end.classList.add('show'); }, SPLASH_COVER_AT);
  setTimeout(startCelebration, TRANS.DRAIN_AT);
}

// video finished (or Play Again) → full restart from the title screen
function restartGame() {
  if (endWatchdog) { clearTimeout(endWatchdog); endWatchdog = null; }   // leaving the end screen
  endFrozen = false;
  const end = document.getElementById('gameEnd'); if (end) end.classList.remove('show');
  stopConfetti();
  const v = document.getElementById('endVideo');
  if (v) { v.onended = null; try { v.pause(); } catch (e) {} }
  // reset customer mode + the customer sequence
  pairMode = false; queue = []; busyLanes = []; servedLevel = null;
  if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
  customerOrder = []; qIndex = 0; spawnCount = 0;
  // restore all customer lanes / bubbles to defaults
  clientEl.className = ''; clientEl.style.left = ''; clientEl.style.opacity = ''; clientEl.style.display = ''; clientEl.style.height = ''; clientEl.style.transition = '';
  [client2El, client3El].forEach(el => { if (el) { el.className = ''; el.style.display = 'none'; el.style.opacity = '0'; el.style.left = ''; el.style.transition = ''; } });
  ['thought2', 'thought3'].forEach(id => { const b = document.getElementById(id); if (b) { b.classList.remove('show'); b.style.left = ''; } });
  if (thoughtEl) thoughtEl.style.left = '';
  const ti = document.getElementById('thoughtInner'); if (ti) ti.textContent = '';
  // back to the title → tutorial → customers again
  level = 0; singleDone = 0; dragonGone = false; titleDone = false;
  if (dragonEl) { dragonEl.classList.remove('exitRight', 'intro'); dragonEl.style.display = ''; dragonEl.style.visibility = ''; }
  const t = document.getElementById('title'); if (t) { t.style.display = ''; t.classList.remove('leaving'); }
  // no "Play Again" button — the title always shows the standard Play button
  const pb = document.getElementById('playBtn');
  if (pb) { pb.src = 'assets map/start-button.webp'; pb.alt = 'Play'; pb.classList.remove('again'); }
  // back on the thumbnail: gameplay music off. The VO is not replayed — it belongs to the
  // one loading sequence, and that has already happened this page session.
  stopGameMusic(); stopTitleSting();
  initRound();
}

// The frozen end card holds its final frame until the player taps it — that tap is the
// "user action" that leaves. It is inert while the video is still playing, so the
// celebration can't be skipped; only the parked final frame is tappable.
(() => {
  const end = document.getElementById('gameEnd');
  if (end) end.addEventListener('pointerdown', () => { if (endFrozen) restartGame(); });
})();

  const r = ROUNDS[level];
  titleDone = true;
  const t = document.getElementById('title');
  if (t) { t.style.display = 'none'; t.classList.remove('leaving'); }

  // dragon host only exists in the tutorial (round 1); hidden for solo jumps
  dragonGone = (level > 0);
  if (dragonEl) {
    dragonEl.classList.remove('exitRight', 'intro');
    dragonEl.style.display = (level > 0) ? 'none' : '';
    dragonEl.style.visibility = '';
  }

  // base reset (mirrors initRound, but no walk-in and no hand-guided tutorial)
  fillPct = 0; hasPoured = false; phase = 'play';
  tutorial = false;
  clearVoiceQueue();
  clearInterval(bannerTimer);
  setJuice(0);
  glassEl.classList.remove('glow', 'wrong');
  clearServed();
  pourBtn.disabled = true;
  checkBtn.style.display = 'none'; checkBtn.disabled = true;
  hideHand();
  if (bannerEl) bannerEl.classList.remove('show', 'introPos');
  if (bannerTxt) bannerTxt.textContent = '';

  // client present immediately (no walk-in animation), order bubble shown
  clientEl.className = '';
  clientEl.style.zIndex = '';
  clientEl.style.height = '';
  clientEl.src = r.client;
  if (r.skin) clientEl.classList.add(r.skin);
  clientEl.style.opacity = '1';
  const thoughtBg = document.getElementById('thoughtBg');
  if (thoughtBg) thoughtBg.src = (r.target === 'half')
    ? 'new assets/dailoge box for half glass.webp'
    : 'new assets/dailoge box.webp';
  setBubbleTop(thoughtEl, r.skin);
  thoughtEl.classList.add('show');
}

// force the guiding hand to a spot (bypasses the cue-visible gate used in play)
function devHand(left, top, drag) {
  handEl.style.left = left; handEl.style.top = top;
  handEl.classList.toggle('dragHint', !!drag);
  handEl.style.display = 'block';
}

function devTargetPct(r) { return (r.target === 'half') ? 50 : 100; }

// ① empty glass, ready to pour
function devToPour(n) {
  devSetupScene(n);
  allowPour();
  showPourHand();
}

// ② glass filled to the round's target, Check button ready
function devToCheck(n) {
  devSetupScene(n);
  const r = ROUNDS[level];
  fillPct = devTargetPct(r); hasPoured = true;
  setJuice(fillPct);
  pourBtn.disabled = (fillPct >= 100);
  phase = 'play';
  enableGlassDrag();               // filled glass → ready to drag onto the tray
  hideHand();
  showGlassGhost();                // ghost glass drifts to the glowing tray
}

// ③ filled glass served on the tray, straw step available
function devToTray(n) {
  devSetupScene(n);
  const r = ROUNDS[level];
  fillPct = devTargetPct(r); hasPoured = true;
  setJuice(fillPct);
  serveToTray();                       // clone the filled glass onto the tray
  strawAdded = false; lemonAdded = false;
  strawBox.style.pointerEvents = 'auto'; strawBox.classList.add('glow');
  lemonBox.style.pointerEvents = 'auto'; lemonBox.classList.add('glow');
  devHand('50%', '60%');
}

// ④ finished drink (straw + lemon) on the tray, draggable to the customer
function devToServe(n) {
  devSetupScene(n);
  const r = ROUNDS[level];
  fillPct = devTargetPct(r); hasPoured = true;
  setJuice(fillPct);
  serveToTray();
  // fast-forward the straw/lemon mini-steps to a finished, draggable drink
  strawAdded = true; lemonAdded = true;
  strawBox.classList.remove('glow'); strawBox.style.pointerEvents = 'none';
  lemonBox.classList.remove('glow'); lemonBox.style.pointerEvents = 'none';
  if (servedSet) {
    const g = servedSet.querySelector('.glassImg');
    if (g) g.style.visibility = 'hidden';   // composite depicts the whole glass — hide the plain one
    servedSet.appendChild(makeCompositeImg(r.target, 'complete'));
    servedSet.addEventListener('pointerdown', onServeDown);
    servedSet.classList.add('draggable');
  }
  devHand('60%', '74%', true);
}

// ── customer-mode quick-jumps (the actual post-tutorial game) ──────────────
// Drops straight into CUSTOMER MODE at a given step: the front customer is
// already at the counter (no walk-in) asking for `target` ('half' | 'full'),
// and more customers keep arriving on the normal ramping timer.
//   step: 'pour' | 'check' | 'tray' | 'serve'
//   lastVisit: true → this is the cycle's ONLY remaining order, so delivering
//   it completes the cycle and rolls into the end screen (for testing the end).
function devPairJump(target, step, lastVisit) {
  devResetScene();
  titleDone = true;
  const t = document.getElementById('title');
  if (t) { t.style.display = 'none'; t.classList.remove('leaving'); }
  dragonGone = true;
  if (dragonEl) { dragonEl.classList.remove('exitRight', 'intro'); dragonEl.style.display = 'none'; }

  // fresh cycle whose FIRST visit matches the requested order type
  pairMode = true; tutorial = false; phase = 'play';
  wrongCheckCount = 0; hintActive = false;
  lastSpawnSkin = null;
  customerOrder = buildCustomerOrder();
  const i = customerOrder.findIndex(v => v.target === target);
  if (i > 0) customerOrder.unshift(customerOrder.splice(i, 1)[0]);
  if (lastVisit) customerOrder = customerOrder.slice(0, 1);
  qIndex = 0; spawnCount = 0; queue = []; busyLanes = [];

  // base machine state (mirrors startPair, minus the walk-in delays)
  clearVoiceQueue();
  clearInterval(bannerTimer);
  clearServed();
  fillPct = 0; hasPoured = false; setJuice(0);
  glassEl.classList.remove('glow', 'wrong');
  pourBtn.disabled = true;
  checkBtn.style.display = 'none'; checkBtn.disabled = true;
  hideHand();
  if (bannerEl) bannerEl.classList.remove('show', 'introPos');
  if (bannerTxt) bannerTxt.textContent = '';
  LANES.forEach(l => {
    l.el.style.display = 'none';
    const b = document.getElementById(l.bubbleId); if (b) b.classList.remove('show');
  });

  // front customer appears already at the counter (skip the 2.8s walk-in)
  const data = nextCustomerData(); spawnCount++;
  const pos = QUEUE_POS[0], L = LANES[0], el = L.el;
  el.className = data.skin;
  el.style.transition = 'none';
  el.style.display = 'block'; el.style.opacity = '1';
  el.style.height = ''; el.style.zIndex = '';
  el.style.left = pos.left;
  el.src = data.img;
  const bg = document.getElementById(L.bgId);
  if (bg) bg.src = (data.target === 'half') ? 'new assets/dailoge box for half glass.webp'
                                            : 'new assets/dailoge box.webp';
  const inner = document.getElementById(L.innerId); if (inner) inner.textContent = '';
  const bubble = document.getElementById(L.bubbleId);
  if (bubble) { bubble.style.transition = 'none'; placeBubble(bubble, pos, data.skin); }
  queue.push({ lane: 0, target: data.target, skin: data.skin, served: false, walkedIn: true });
  refreshActive();                    // order bubble opens immediately
  if (!lastVisit) scheduleSpawn();    // the rest of the line keeps arriving as usual

  // fast-forward the juice machine to the requested step
  const pct = (target === 'half') ? 50 : 100;
  if (step === 'pour') {
    allowPour();
    armPourNudge();                   // idle ~11s → hand nudge, same as real play
  } else if (step === 'check') {
    fillPct = pct; hasPoured = true; setJuice(fillPct);
    pourBtn.disabled = (fillPct >= 100);
    checkBtn.style.display = 'block'; checkBtn.disabled = false;
    armPourNudge();                   // idle ~11s → hand nudge on Check
  } else if (step === 'tray' || step === 'serve') {
    fillPct = pct; hasPoured = true; setJuice(fillPct);
    servedLevel = target;             // serveToTray reads this in customer mode
    serveToTray();
    if (step === 'tray') {
      strawAdded = false; lemonAdded = false;
      strawBox.style.pointerEvents = 'auto'; strawBox.classList.add('glow');
      lemonBox.style.pointerEvents = 'auto'; lemonBox.classList.add('glow');
    } else {
      // finished drink (straw + lemon), draggable to the customer
      strawAdded = true; lemonAdded = true;
      strawBox.classList.remove('glow'); strawBox.style.pointerEvents = 'none';
      lemonBox.classList.remove('glow'); lemonBox.style.pointerEvents = 'none';
      if (servedSet) {
        const g = servedSet.querySelector('.glassImg');
        if (g) g.style.visibility = 'hidden';
        servedSet.appendChild(makeCompositeImg(target, 'complete'));
        servedSet.addEventListener('pointerdown', onServeDown);
        servedSet.classList.add('draggable');
      }
    }
  }
}


// ── boot ──────────────────────────────────────────────────────
// ==== boot preloader ==========================================
// Fetches EVERY asset before the Play button appears, with byte-accurate progress.
//  * weighted by real on-disk sizes (ASSET_BYTES), refined by each Content-Length
//  * streaming reader -> the bar moves with real bytes, and only ever forwards
//  * smallest-first so cover art / customers / props land in the first seconds and are
//    never starved behind the big music track or the end video
//  * media elements are handed blob: URLs, so "loaded" really means local
//  * nothing can block the player: any failure, stall or abort - or file://, where fetch
//    is blocked outright - counts as done and the element keeps its original src
const PRELOAD_CONCURRENCY = 5;
// STALL timeout, not a total-transfer deadline: a big file on a slow link can legitimately
// take a while, and a request can also sit queued behind others. We only abort when a
// transfer stops making progress, so healthy slow downloads are never killed.
const PRELOAD_STALL_MS    = 12000;
const PRELOAD_HARD_CAP_MS = 20000;   // absolute reveal deadline - the player always gets in

function bootPreload() {
  const wrap = document.getElementById('loadWrap');
  const fill = document.getElementById('loadFill');
  const pctEl = document.getElementById('loadPct');
  const btn  = document.getElementById('playBtn');

  const jobs = [];
  PRELOAD_ASSETS.forEach(src => jobs.push({ src: src, kind: 'img' }));
  AUDIO_REG.forEach(a => jobs.push({ src: a.src, kind: 'audio', el: a.el }));
  const vid = document.getElementById('endVideo');
  const vsrcEl = vid ? vid.querySelector('source') : null;
  if (vsrcEl) jobs.push({ src: vsrcEl.getAttribute('src'), kind: 'video', el: vid, srcEl: vsrcEl });

  // ASSET_BYTES is keyed by the original .ogg/.webm names, so fall back to those when the
  // AAC/H.264 siblings are in play (each fetch's Content-Length refines the weight anyway)
  jobs.forEach(j => {
    j.weight = ASSET_BYTES[j.src]
            || ASSET_BYTES[j.src.replace(/\.m4a$/i, '.ogg').replace(/\.mp4$/i, '.webm')]
            || 40000;
    j.got = 0;
  });
  jobs.sort((a, b) => a.weight - b.weight);            // smallest first
  let total = jobs.reduce((s, j) => s + j.weight, 0) || 1;

  let shown = 0, finished = false;
  function paint() {
    total = jobs.reduce((s, j) => s + j.weight, 0) || 1;
    const got = jobs.reduce((s, j) => s + Math.min(j.got, j.weight), 0);
    let p = Math.round(got / total * 100);
    if (p < shown) p = shown;                           // monotonic
    if (p > 100) p = 100;
    shown = p;
    if (fill)  fill.style.width = p + '%';
    if (pctEl) pctEl.textContent = p + '%';
    if (wrap)  wrap.setAttribute('aria-valuenow', String(p));
  }
  function reveal() {
    if (finished) return;
    finished = true;
    shown = 100;
    if (fill)  fill.style.width = '100%';
    if (pctEl) pctEl.textContent = '100%';
    if (wrap)  wrap.setAttribute('aria-valuenow', '100');
    assetsReady = true;                                 // unlocks leaveTitle()
    setTimeout(() => {
      if (wrap) wrap.classList.add('done');
      if (btn)  btn.classList.add('ready');             // pop-in
      playTitleSting();                                 // loading hit 100% → the VO plays here
      setTimeout(() => { if (wrap && wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 500);
    }, 220);
  }

  // hand a fetched blob to its media element, with a one-time revert to the file URL
  function attachBlob(job, blob) {
    const url = URL.createObjectURL(blob);
    const el = job.el, orig = job.src;
    const onErr = () => {
      if (job.kind === 'video') {
        const wasPlaying = !el.paused;
        job.srcEl.setAttribute('src', orig);
        try { el.load(); if (wasPlaying) el.play().catch(() => {}); } catch (e) {}
      } else {
        el.src = orig;
      }
    };
    el.addEventListener('error', onErr, { once: true });
    if (job.kind === 'video') { job.srcEl.setAttribute('src', url); try { el.load(); } catch (e) {} }
    else { el.src = url; }
  }

  function fetchOne(job) {
    if (typeof fetch !== 'function') { job.got = job.weight; paint(); return Promise.resolve(); }
    const ctl = ('AbortController' in window) ? new AbortController() : null;
    let idle = null;
    const bump = () => {                                 // reset the stall clock on progress
      if (idle) clearTimeout(idle);
      idle = setTimeout(() => { try { if (ctl) ctl.abort(); } catch (e) {} }, PRELOAD_STALL_MS);
    };
    bump();
    return fetch(job.src, ctl ? { signal: ctl.signal } : undefined).then(res => {
      bump();
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const len = parseInt(res.headers.get('content-length') || '0', 10);
      if (len > 0) job.weight = Math.max(len, 1);        // refine the weight
      if (res.body && res.body.getReader) {
        const reader = res.body.getReader(), chunks = [];
        let got = 0;
        const pump = () => reader.read().then(r => {
          if (r.done) return new Blob(chunks, { type: res.headers.get('content-type') || '' });
          bump();                                        // bytes arrived -> not stalled
          chunks.push(r.value); got += r.value.length;
          if (got > job.weight) job.weight = got;
          job.got = got; paint();
          return pump();
        });
        return pump();
      }
      return res.blob();
    }).then(blob => {
      job.got = job.weight;
      if (job.el) attachBlob(job, blob);
      else if (job.kind === 'img') {
        return new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = job.src; });
      }
    }).catch(() => {
      job.got = job.weight;                              // never block on a failure
    }).then(() => {
      if (idle) clearTimeout(idle);
      paint();
    });
  }

  paint();
  let idx = 0;
  const worker = () => (idx >= jobs.length) ? Promise.resolve() : fetchOne(jobs[idx++]).then(worker);
  const lanes = [];
  for (let i = 0; i < Math.min(PRELOAD_CONCURRENCY, jobs.length); i++) lanes.push(worker());
  Promise.all(lanes).then(reveal, reveal);
  setTimeout(reveal, PRELOAD_HARD_CAP_MS);               // absolute safety net
  // file:// blocks fetch for every asset - reveal promptly instead of grinding to the cap
  if (location.protocol === 'file:') setTimeout(reveal, 1200);
}

// ── auto-pause when the tab goes inactive ─────────────────────
// Page Visibility API: switching tabs, minimising the window and backgrounding the app all
// fire visibilitychange with document.hidden set. The game pauses on the spot and STAYS
// paused when the player comes back — the pause screen waits for a tap on Resume, nothing
// resumes on its own. Tutorial and normal play go through the same path, since everything it
// freezes (timers, audio, CSS animations, input) is shared by both.
// It only engages while a game is actually running: the title screen is still streaming
// assets through its own timers, and the end-screen celebration owns the video and its
// hand-off back to the title — neither is gameplay, so both are left alone.
const pauseScreenEl = document.getElementById('pauseScreen');
let audioHeld = [];
// AUDIO_REG is every clip the game owns — music, SFX and the dragon's narration. pause()
// keeps currentTime, so a half-spoken line carries on from the syllable it stopped at.
function holdAudio() {
  audioHeld = [];
  AUDIO_REG.forEach(entry => {
    const a = entry.el;
    if (!a || a.paused || a.ended) return;
    audioHeld.push(a);
    try { a.pause(); } catch (e) {}
  });
}
function releaseAudio() {
  const list = audioHeld;
  audioHeld = [];
  list.forEach(a => { try { const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} });
}
// A drag in flight when the tab goes away can never get its pointerup — the pointer is
// released somewhere else entirely — which would strand the glass mid-air. The pointercancel
// handlers do exactly this, so reuse them rather than repeating the teardown.
function cancelActiveDrags() {
  onGlassCancel();
  onServeCancel();
}
function pauseGame() {
  if (gamePaused) return;
  gamePaused = true;
  holdTimers();                                      // ① the flow clock stops first
  holdAudio();                                       // ② music, SFX and narration
  cancelActiveDrags();                               // ③ nothing left hanging off a pointer
  if (gcEl) gcEl.classList.add('paused');            // ④ freeze every CSS animation on the board
  if (pauseScreenEl) {                               // ⑤ …and cover it, so nothing is tappable
    pauseScreenEl.classList.add('show');
    pauseScreenEl.setAttribute('aria-hidden', 'false');
  }
}
function resumeGame() {                              // wired to the Resume button
  if (!gamePaused) return;
  gamePaused = false;
  if (pauseScreenEl) {
    pauseScreenEl.classList.remove('show');
    pauseScreenEl.setAttribute('aria-hidden', 'true');
  }
  if (gcEl) gcEl.classList.remove('paused');
  releaseAudio();
  releaseTimers();                                   // every held beat picks up where it stopped
  pumpDialogue();                                    // …including a line that came due while paused
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;                      // back on screen → stay paused, wait for Resume
  if (!titleDone || phase === 'gameover' || gamePaused) return;
  pauseGame();
});

bootPreload();
initRound();
</script>

<!-- ── GO FULLSCREEN ON PLAY ───────────────────────────────────────────────────
     The flipbook hosts this game in an iframe the size of one book page, which is
     a small window for a game. Tapping Play now asks for fullscreen so it fills
     the screen instead.
     It has to be requested HERE, from inside the game: the request needs the user
     gesture in the document that makes it, and a click in this iframe never
     reaches the book. The book's side of the deal is `allow="fullscreen"` on the
     iframe.
     A SEPARATE listener, deliberately — the button's own onclick="leaveTitle()"
     is untouched, so if fullscreen is refused (iOS Safari does not allow it on a
     non-video element) the game still starts exactly as before. Standalone, this
     simply makes Play fullscreen the page, which is no worse.               -->
<script>
(function () {
  // Report in, so the book can tell a LOADED game from a missing one. A frame
  // whose document 404s still fires `load` and is cross-origin, so the book has
  // nothing to inspect — silence here is what makes it show its own notice
  // instead of a blank page.
  if (window.parent !== window) {
    try { window.parent.postMessage({ source: 'lbd', type: 'ready' }, '*'); } catch (e) {}
  }
  var btn = document.getElementById('playBtn');
  if (!btn) return;

  // SWITCH TO FULLSCREEN WHILE THE SCREEN IS COVERED, so the resize is never seen.
  // Doing it on the tap meant watching the viewport jump; doing it under a wipe
  // hides it, which is what a wipe is for.
  //
  // This game had no transition on Play — leaveTitle() hid the title outright
  // ("no shutter — go straight into the game"). It DOES already own the pink
  // juice-splash wipe it uses between the tutorial and the customers, so that is
  // reused here rather than inventing anything: burst → (covered) switch + start →
  // drain reveals the game, now full size.
  // ⚠ This adds an opening wipe the game did not have. To go back to the old
  //    instant start, replace the body of the handler below with `start();`.
  //
  // Timing comes from the game's OWN constants so the two cannot drift apart.
  // The wipe holds full cover only from ~740ms (waves home, TRANS.BURST + 40) to
  // TRANS.DRAIN_AT = 1040ms — a 300ms window — and the game already names the
  // safe moment inside it: SPLASH_COVER_AT (820ms), which is where it swaps its
  // own end screen in. Switching at BURST + 30 = 730ms was ~10ms BEFORE the waves
  // were even home, so the switch straddled the moment the cover completed and
  // was still settling as the drain began. That was the roughness. Use the game's
  // own number: 80ms after full cover, 220ms of clearance before the drain.
  // The wipe holds full cover from BURST + 40 (its own `coverAt` — the waves reach
  // home) until DRAIN_AT = 1040ms. Ask at the START of that window, not the middle:
  // the book now FADES its mask in over 160ms before answering `masked`, and the
  // switch itself measured ~50ms, so asking at 740 lands the switch at ~950 — still
  // 90ms clear of the drain. (Asking at 820 left too little room; asking at 730, as
  // this first did, was before the waves were even home.)
  var COVERED = (typeof TRANS === 'object' && TRANS && TRANS.BURST) ? TRANS.BURST + 40 : 740;

  var started = false;
  function start() {                    // fullscreen, then hand over to the game
    if (started) return;
    started = true;
    var el = document.documentElement;
    var go = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    var already = document.fullscreenElement || document.webkitFullscreenElement;
    // Only go through the mask-and-switch dance if the switch CAN actually happen.
    // fullscreenEnabled is false inside a file:// frame (permission is denied on an
    // opaque origin) and true over http, so a double-clicked book was asking for a
    // full-screen pink mask that hid NOTHING: the reader saw this game's own pink
    // wipe plus a pink flash across the desk around the book. Windowed, the wipe
    // alone is seamless. (!== false so a browser without the property still tries.)
    var canSwitch = document.fullscreenEnabled !== false;
    if (go && !already && canSwitch) {
      // Ask the book to paint the same pink over the WHOLE screen first, and WAIT
      // for it to say the paint has landed. The wipe only covers this frame; the
      // frame growing from a page-sized box to the screen is plainly visible
      // around it unless everything else is already the same colour.
      // The handshake matters: posting and switching in the same breath left the
      // mask ~15ms — under one frame — so it was never actually on screen.
      switchWhenMasked(el, go);
    }
    leaveTitle();                       // idempotent: guards on titleDone
  }

  // Ask → wait for "masked" → switch. Falls back to switching anyway if the book
  // does not answer (standalone, or a future host that does not know the protocol),
  // so fullscreen is never lost waiting for an ack that is not coming.
  function switchWhenMasked(el, go) {
    var went = false;
    function go2() {
      if (went) return;
      went = true;
      // The wipe's splat is sized to the CURRENT viewport. Going fullscreen makes
      // the viewport bigger, so the splat no longer reaches the new corners and
      // the page background shows through there — measured as 19,8,34 (this
      // game's dark purple) right after the switch, which is precisely what made
      // the change visible. Painting the page itself the same pink for the
      // duration of the wipe means the corners are pink too, so there is nothing
      // to notice. It sits BEHIND everything, so the drain still reveals the
      // scene normally; it is cleared once the wipe has finished.
      var prev = el.style.background;
      el.style.background = '#F77ADE';
      setTimeout(function () { el.style.background = prev; },
                 (typeof TRANS === 'object' && TRANS && TRANS.CLEANUP) ? TRANS.CLEANUP : 2300);
      // Report the outcome EITHER WAY so the book clears its pink mask the moment
      // the switch has settled. On a fixed timer the mask outlived a refused
      // switch (file://) and sat over the wipe's reveal.
      var settled = function () {
        try { if (window.parent !== window)
          window.parent.postMessage({ source: 'lbd', type: 'switched' }, '*'); } catch (e2) {}
      };
      try {
        var p = go.call(el, { navigationUI: 'hide' });
        if (p && p.then) p.then(settled, settled); else settled();
      } catch (e) { settled(); }
    }
    if (window.parent === window) { go2(); return; }   // not framed → nothing to mask
    window.addEventListener('message', function onMsg(ev) {
      if (!ev.data || ev.data.source !== 'book' || ev.data.type !== 'masked') return;
      window.removeEventListener('message', onMsg);
      go2();
    });
    try { window.parent.postMessage({ source: 'lbd', type: 'covered' }, '*'); } catch (e) {}
    setTimeout(go2, 700);                              // no ack → go regardless
  }

  btn.addEventListener('click', function () {
    if (started) return;
    // Nothing to hide behind if the wipe is unavailable — just go.
    if (typeof playSplashTransition !== 'function') { start(); return; }
    playSplashTransition();
    setTimeout(start, COVERED);
  });

  // ── TELL THE BOOK WHEN THE GAME ENDS ────────────────────────────────────────
  // Hosted in the flipbook, this game is a page. Once the celebration is up the
  // reader has finished and should be invited to turn on — so the book is told,
  // and it answers by playing its page-turn cue and letting the page be dragged.
  // Watched from OUT HERE rather than wired into the game's own code: `#gameEnd`
  // gaining `.show` IS the end screen appearing, and losing it is restartGame()
  // going back to the title. Nothing in the game's logic is touched.
  // The book must let go again on that restart, or the reader could never press
  // Play a second time.
  if (window.parent !== window) {
    var endEl = document.getElementById('gameEnd');
    if (endEl) {
      var wasShown = false;
      var tell = function (type) {
        try { window.parent.postMessage({ source: 'lbd', type: type }, '*'); } catch (e) {}
      };
      new MutationObserver(function () {
        var shown = endEl.classList.contains('show');
        if (shown === wasShown) return;
        wasShown = shown;
        tell(shown ? 'end' : 'restart');
      }).observe(endEl, { attributes: true, attributeFilter: ['class'] });
    }
  }
})();
</script>
</body>
</html>
