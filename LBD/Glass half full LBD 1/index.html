}
function unfreezeDragon() {
  if (dragonFreezeCv) dragonFreezeCv.style.display = 'none';
  if (dragonEl) dragonEl.style.visibility = '';
}
function dragonTalk(on) {
  if (!dragonEl || dragonGone) return;
  on = !!on;
  if (on === dragonTalking) return;
  dragonTalking = on;
  if (on) unfreezeDragon();          // audio playing → show the live animated image
  else    freezeDragon();            // audio stopped → freeze on the current frame
}
if (dragonEl) {
  const startIdle = () => { dragonTalking = true; dragonTalk(false); };  // freeze until it speaks
  if (dragonEl.complete && dragonEl.naturalWidth) startIdle();
  else dragonEl.addEventListener('load', startIdle, { once: true });
}

// ── dragon movement: one smooth glide, THEN the box appears ────
// Two things made the old move look abrupt:
//   1. while the dragon is idle the live <img> is hidden behind the frozen canvas above, so a
//      class change glided an invisible element and the dragon simply reappeared at the far
//      end — it never visibly travelled at all.
//   2. the next dialogue box was shown in the same breath as the class change, so it sat there
//      through the whole trip.
// glideDragon() fixes both: it shows the live image for the trip (so the CSS ease-in/ease-out
// glide is actually seen) and HOLDS the dialogue queue until the dragon lands. The box — and
// the dragon's talk UI with it — then fade in together, at the destination, never mid-move.
const DRAGON_MOVE_MS = 900;          // keep in sync with the #dragon / #dragonBubble transition
let dragonMoving = false, dragonMoveTimer = null, dragonMoveEnd = null;
// clear the gate without releasing the queue (used on resets)
function resetDragonMove() {
  if (dragonMoveTimer) { clearTimeout(dragonMoveTimer); dragonMoveTimer = null; }
  if (dragonMoveEnd && dragonEl) dragonEl.removeEventListener('transitionend', dragonMoveEnd);
  dragonMoveEnd = null;
  const wasMoving = dragonMoving;
  dragonMoving = false;
  return wasMoving;
}
// the dragon has landed → let the held line (and its box) appear
function endDragonMove() { if (resetDragonMove()) pumpDialogue(); }
// `reposition` is the class change that moves the dragon; everything around it is the polish
function glideDragon(reposition) {
  resetDragonMove();                                 // never two glides in flight
  if (bannerEl) bannerEl.classList.remove('show');   // box stays down for the whole trip
  unfreezeDragon();                                  // live image → the movement is visible
  if (reposition) reposition();                      // start the CSS glide
  if (!dragonEl) { pumpDialogue(); return; }
  dragonMoving = true;
  dragonMoveEnd = (e) => {
    if (e.target !== dragonEl) return;
    if (e.propertyName !== 'left' && e.propertyName !== 'top') return;
    endDragonMove();                                 // arrived
  };
  dragonEl.addEventListener('transitionend', dragonMoveEnd);
  // safety net: if the glide never runs (dragon already in place) or the event is missed,
  // land anyway so the dialogue can never stay held shut
  dragonMoveTimer = setTimeout(endDragonMove, DRAGON_MOVE_MS + 200);
}

// end of tutorial: the host dragon slides off to the right and is removed,
// together with its dialogue box. No more narration bubble after this.
function dragonExit() {
  if (dragonGone) return;
  unfreezeDragon();                                    // show the live image so the slide-off is visible
  dragonGone = true;
  if (bannerEl) bannerEl.classList.remove('show');     // remove the dialogue box
  if (dragonEl) {
    dragonEl.classList.add('exitRight');               // slide off to the right
    setTimeout(() => { if (dragonEl) dragonEl.style.display = 'none'; }, 1000);  // then remove
  }
  playSplashTransition();                              // pink juice-splash wipe into customer mode
}

// ── 2+ wrong-Check hint: customer bubble glows → the dragon pops back in with a
// pour-count tip → the dragon leaves again → a hand nudge guides the next pour.
// Works in both solo rounds and customer/pair mode (the dragon may already be
// "gone" for good in pair mode — this brings it back just for the one line).
let wrongCheckCount = 0;
let hintActive = false;   // true while the wrong-hint sequence runs → suppresses every other hand cue
function triggerWrongHint(target, bubbleEl) {
  if (!bubbleEl || !dragonEl || hintActive) return;   // don't stack if one is already running
  hintActive = true;
  hideHand();             // no hand anywhere while the dragon does its thing

  // 1) glow the customer's order bubble to draw attention
  bubbleEl.classList.remove('glow'); void bubbleEl.offsetWidth; bubbleEl.classList.add('glow');
  setTimeout(() => bubbleEl.classList.remove('glow'), 2000);

  // 2) shortly after, the dragon slides fully into view first —
  // (phase is still 'done' here — tryAgain() only flips it back to 'play' a bit
  // later — so only bail if the round itself has actually moved on/ended)
  setTimeout(() => {
    if (phase === 'gameover' || phase === 'intro') { hintActive = false; return; }   // round ended/reset
    const wasGone = dragonGone;
    unfreezeDragon();
    dragonEl.classList.remove('exitRight');
    dragonEl.style.display = '';
    void dragonEl.offsetWidth;
    dragonEl.classList.add('hintIn');

    // 3) only once the dragon has FULLY arrived does its dialogue box appear
    setTimeout(() => {
      if (phase === 'gameover' || phase === 'intro') {          // round ended mid-slide — bail cleanly
        dragonEl.classList.remove('hintIn'); dragonEl.style.display = 'none'; dragonGone = wasGone; hintActive = false; return;
      }
      dragonGone = false;                               // now let the line show its bubble + voice
      hideHand();                                       // belt-and-braces: no stray hand during the line
      pourBtn.disabled = true;                          // keep POUR locked so the line can't be cut short
      const line = target === 'full' ? 'Tap the Pour button 4 times.' : 'Tap the Pour button 2 times.';
      // typeBanner's 3rd arg fires only AFTER the whole line has been delivered (typed + read)
      typeBanner(line, null, () => {
        // 4) dialogue fully delivered → brief beat, THEN the dragon leaves the screen
        setTimeout(() => {
          if (bannerEl) bannerEl.classList.remove('show');   // dismiss the bubble as the dragon departs
          unfreezeDragon();                                  // hide the freeze-canvas so the LIVE dragon slides out (not a frozen copy)
          dragonEl.classList.remove('hintIn');
          dragonEl.classList.add('exitRight');
          setTimeout(() => {
            if (dragonEl) { dragonEl.classList.remove('exitRight'); dragonEl.style.display = 'none'; }
            unfreezeDragon();                                // belt-and-braces: ensure no frozen dragon lingers
            dragonGone = wasGone;
            hintActive = false;
            // 5) only after the dragon has fully exited does the hand hint appear
            if (phase === 'play') { allowPour(); showPourHand(); armPourNudge(); }
          }, 1000);
        }, 500);   // reading beat after the line is complete
      });
    }, 800);   // matches the #dragon.hintIn slide-in duration (0.8s)
  }, 900);
}

let actx = null;
function beep(freq, dur, type) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, actx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
// a short, soft mechanical "click" for the dragon's typewriter text
function typeClick() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    const t = actx.currentTime;
    o.type = 'square';
    o.frequency.setValueAtTime(1500, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.045, t + 0.004);   // soft typewriter tick (quieter)
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.028);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + 0.035);
  } catch (e) {}
}
function playPourSound() { beep(520, 0.18, 'triangle'); }
function playWinSound()  { beep(660, 0.12); setTimeout(() => beep(880, 0.16), 130); }
function playWrongSound(){ try { wrongSound.currentTime = 0; wrongSound.play().catch(() => {}); } catch (e) {} }

// a bright "pop" for elements popping in
function popSound() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    const t = actx.currentTime;
    o.type = 'sine';
    o.frequency.setValueAtTime(300, t);
    o.frequency.exponentialRampToValueAtTime(900, t + 0.08);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.28, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + 0.18);
  } catch (e) {}
}

// ── juice splash transition (plays when the tutorial dragon leaves) ──
// (bubblePop / whooshSound are legacy helpers, kept for reference)
function bubblePop() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const base = 420 + Math.random() * 300;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base * 2.3, t + 0.05);   // quick "bloop" upward
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.14, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + 0.15);
  } catch (e) {}
}
// an airy "whoosh" for the pastel wipe sweep
function whooshSound() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime, dur = 0.55;
    const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = actx.createBufferSource(); src.buffer = buf;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.7;
    bp.frequency.setValueAtTime(380, t);
    bp.frequency.exponentialRampToValueAtTime(2600, t + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.10, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(actx.destination);
    src.start(t); src.stop(t + dur);
  } catch (e) {}
}
// droplets that spray ahead of the splat's expanding edge
function spawnSplashDrops(fx) {
  const rect = fx.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  for (let i = 0; i < 16; i++) {
    const d = document.createElement('div');
    d.className = 'splash-drop';
    const size = 10 + Math.random() * 30;
    d.style.width = size + 'px';
    d.style.height = size + 'px';
    fx.appendChild(d);
    const ang  = Math.random() * Math.PI * 2;
    const dist = rect.width * (0.28 + Math.random() * 0.34);
    const x0 = cx + Math.cos(ang) * rect.width * 0.12 - size / 2;
    const y0 = cy + Math.sin(ang) * rect.height * 0.14 - size / 2;
    const x1 = cx + Math.cos(ang) * dist - size / 2;
    const y1 = cy + Math.sin(ang) * dist * 0.75 - size / 2;
    d.animate([
      { transform: 'translate(' + x0.toFixed(0) + 'px,' + y0.toFixed(0) + 'px) scale(0.6)', opacity: 1 },
      { transform: 'translate(' + x1.toFixed(0) + 'px,' + y1.toFixed(0) + 'px) scale(' + (0.5 + Math.random() * 0.7).toFixed(2) + ')', opacity: 0 }
    ], { duration: 400 + Math.random() * 260, delay: 120 + Math.random() * 240, easing: 'cubic-bezier(0.2,0.6,0.4,1)', fill: 'forwards' });
    setTimeout(() => d.remove(), 950);
  }
}

// ── the pink juice-splash wipe ────────────────────────────────
// ONE timeline drives the whole effect, and the sound is fitted to it (never the reverse).
// Phases: splat bursts out → waves glide in behind it → splat crossfades away → waves drain
// off the bottom, revealing the new scene.
const TRANS = {
  BURST:    700,   // splat expands from nothing to swallowing the board
  WAVE_IN:  300,   // waves glide into place BEHIND the opaque splat (overlaps the burst)
  FADE:     340,   // splat crossfades out once the waves are home
  DRAIN_AT: 1040,  // waves start falling away
  DRAIN:    1040,  // how long they take to clear the board
  STAGGER:   90,   // front wave trails the back one
  CLEANUP:  2260   // everything parked + torn down
};
function playSplashTransition() {
  const fx    = document.getElementById('splash');
  if (!fx) return;
  const splat = document.getElementById('splat');
  const back  = fx.querySelector('.wave-back');
  const front = fx.querySelector('.wave-front');

  // clean restart if a previous run is mid-flight
  [splat, back, front].forEach(el => el && el.getAnimations().forEach(a => a.cancel()));
  fx.querySelectorAll('.splash-drop').forEach(d => d.remove());
  back.style.transform  = 'translateY(-135%)';     // waves parked above the board
  front.style.transform = 'translateY(-135%)';
  splat.style.opacity   = '1';
  splat.style.transform = 'translate(-50%,-50%) scale(0)';
  fx.classList.add('run');
  playTransitionSfx();                             // sound fitted to the timeline above

  // The splat bursts OUT: fast off the mark, easing into its full size. (This used to run on
  // an ease-IN curve, which sat still for ~200ms and then lurched — the main source of the
  // jerk.) A little rotation keeps the blob from looking like a plain scale.
  splat.animate([
    { transform: 'translate(-50%,-50%) scale(0)    rotate(-14deg)' },
    { transform: 'translate(-50%,-50%) scale(3.1)  rotate(-2deg)'  },
    { transform: 'translate(-50%,-50%) scale(4.8)  rotate(9deg)'   }
  ], { duration: TRANS.BURST, easing: 'cubic-bezier(0.16,0.84,0.3,1)', fill: 'forwards' });
  spawnSplashDrops(fx);

  // Each wave runs as ONE continuous animation — park, glide in behind the splat, hold at
  // full cover, then drain away. Doing it as a single track (rather than a glide animation
  // followed by a separate drain animation) means the phases cannot hand off with a jump:
  // there is no seam for the two to disagree about. (.wave has no CSS transition either, so
  // the old `style.transform = ...` cover was an instant teleport mid-effect.)
  const glideAt = TRANS.BURST - TRANS.WAVE_IN + 40;   // starts while the splat still hides it
  const coverAt = TRANS.BURST + 40;                   // home just as the splat peaks
  const waveTrack = (delay) => {
    const total = TRANS.DRAIN_AT + delay + TRANS.DRAIN;
    const at = ms => Math.min(1, Math.max(0, ms / total));
    return {
      keyframes: [
        { offset: 0,                          transform: 'translateY(-135%)' },
        { offset: at(glideAt),                transform: 'translateY(-135%)',
          easing: 'cubic-bezier(0.3,0.7,0.3,1)' },                    // glide in
        { offset: at(coverAt),                transform: 'translateY(-16%)' },
        { offset: at(TRANS.DRAIN_AT + delay), transform: 'translateY(-16%)',
          easing: 'cubic-bezier(0.45,0.05,0.75,0.6)' },               // fall under gravity
        { offset: 1,                          transform: 'translateY(116%)' }
      ],
      total: total
    };
  };
  [[back, 0], [front, TRANS.STAGGER]].forEach(([w, delay]) => {
    const tr = waveTrack(delay);
    w.animate(tr.keyframes, { duration: tr.total, fill: 'forwards' });
  });

  // ...and the splat crossfades away over the waves (same pink, so the seam is invisible)
  setTimeout(() => {
    splat.animate([{ opacity: 1 }, { opacity: 0 }],
      { duration: TRANS.FADE, easing: 'ease-in-out', fill: 'forwards' });
  }, coverAt);

  // tidy up after the drain finishes
  setTimeout(() => {
    [splat, back, front].forEach(el => el && el.getAnimations().forEach(a => a.cancel()));
    fx.classList.remove('run');
    back.style.transform  = 'translateY(-135%)';
    front.style.transform = 'translateY(-135%)';
    splat.style.opacity   = '0';
    splat.style.transform = 'translate(-50%,-50%) scale(0)';
    fx.querySelectorAll('.splash-drop').forEach(d => d.remove());
  }, TRANS.CLEANUP);
}

// Fit the SFX to the visual timeline above.
//  • transation.ogg opens with ~120ms of digital silence — skipped, so the whoosh is audible
//    from the first frame of the burst instead of trailing it
//  • its impact peak (~480-660ms in the file) then lands as the splat swallows the board
//  • the file runs 3.06s but the wipe is done at ~2.1s, so the tail is faded out to finish
//    WITH the drain rather than bleeding into the next scene
const SFX_LEAD_IN = 0.12;                                  // measured dead air at the top
function playTransitionSfx() {
  const s = transitionSound;
  if (!s) return;
  const fadeStart = TRANS.DRAIN_AT + TRANS.DRAIN * 0.45;   // begin fading mid-drain
  const fadeMs    = (TRANS.CLEANUP - 160) - fadeStart;
  if (s._fade) { clearInterval(s._fade); s._fade = null; }
  try {
    s.volume = 0.7;
    s.currentTime = SFX_LEAD_IN;
    s.play().catch(() => {});
  } catch (e) { return; }
  setTimeout(() => {                                       // smooth tail-out, then stop
    const v0 = s.volume, t0 = Date.now();
    s._fade = setInterval(() => {
      const k = Math.min(1, (Date.now() - t0) / Math.max(120, fadeMs));
      s.volume = Math.max(0, v0 * (1 - k));
      if (k >= 1) {
        clearInterval(s._fade); s._fade = null;
        try { s.pause(); s.currentTime = SFX_LEAD_IN; s.volume = v0; } catch (e) {}
      }
    }, 40);
  }, fadeStart);
}

// a wet juice-splash sound: liquid rush → SPLAT at full cover → droplets → drain
function splashSound() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    // filtered-noise helper (rise/fall a bandpass over a short burst)
    const noise = (start, dur, f0, f1, peak, type) => {
      const buf = actx.createBuffer(1, Math.max(1, Math.floor(actx.sampleRate * dur)), actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const src = actx.createBufferSource(); src.buffer = buf;
      const bp = actx.createBiquadFilter(); bp.type = type || 'bandpass'; bp.Q.value = 0.8;
      bp.frequency.setValueAtTime(f0, start);
      bp.frequency.exponentialRampToValueAtTime(f1, start + dur);
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(peak, start + Math.min(0.05, dur * 0.25));
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      src.connect(bp); bp.connect(g); g.connect(actx.destination);
      src.start(start); src.stop(start + dur);
    };
    noise(t,        0.55, 500, 1900, 0.12, 'bandpass');   // liquid rushing outward
    noise(t + 0.68, 0.30, 1400, 300, 0.24, 'lowpass');    // big wet SPLAT at full cover
    // low thud under the splat (scheduled to land with the cover)
    const o = actx.createOscillator(), tg = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(180, t + 0.68);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.86);
    tg.gain.setValueAtTime(0.0001, t + 0.68);
    tg.gain.exponentialRampToValueAtTime(0.2, t + 0.71);
    tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(tg); tg.connect(actx.destination);
    o.start(t + 0.68); o.stop(t + 0.92);
    for (let i = 0; i < 6; i++) {                          // droplets pattering down
      const dt = 0.78 + Math.random() * 0.5;
      noise(t + dt, 0.06, 400 + Math.random() * 700, 260, 0.05, 'bandpass');
    }
    noise(t + 1.4,  0.55, 900, 180, 0.10, 'lowpass');     // draining away
  } catch (e) {}
}

// ── round init ────────────────────────────────────────────────
function initRound() {
  const r = ROUNDS[level];
  fillPct = 0; hasPoured = false; phase = 'intro';
  wrongCheckCount = 0; hintActive = false;   // fresh round → reset the wrong-attempt streak + hint
  tutorial = (r.skin === 'ghost');   // full hand-guided walkthrough for the ghost
  if (bannerEl) bannerEl.classList.remove('show');   // dragon's bubble appears when it speaks
  // a fresh tutorial run (rounds loop back to the ghost) brings the host dragon back
  if (tutorial && dragonEl) {
    dragonGone = false;
    dragonEl.classList.remove('exitRight', 'intro');
    dragonEl.style.display = '';
  }
  if (bannerEl) bannerEl.classList.remove('introPos');

  setJuice(0);
  glassEl.classList.remove('glow', 'gone', 'appearIn');   // fresh round → glass visible, no highlight
  disableGlassDrag();                 // empty glass → not draggable until poured
  clearServed();
  pourBtn.disabled = true;            // every interaction starts locked, unlocked by its instruction
  removePulse();
  handEl.style.display = 'none';
  clearInterval(bannerTimer);
  if (bannerTxt) bannerTxt.textContent = '';
  clearVoiceQueue();                 // drop any narration left over from the previous round

  // load this round's client (hidden until it walks in)
  clientEl.className = '';
  clientEl.style.zIndex = '';        // back behind the counter
  clientEl.style.height = '';
  clientEl.src = r.client;
  if (r.skin) clientEl.classList.add(r.skin);
  // half-glass customers get their own order bubble art
  const thoughtBg = document.getElementById('thoughtBg');
  if (thoughtBg) thoughtBg.src = (r.target === 'half')
    ? 'new assets/dailoge box for half glass.webp'
    : 'new assets/dailoge box.webp';
  // the order is shown by the bubble art itself — no text overlay
  const thoughtInner = document.getElementById('thoughtInner');
  if (thoughtInner) { thoughtInner.textContent = ''; thoughtInner.style.fontSize = ''; }
  hideThought();

  if (titleDone) setTimeout(walkInClient, 400);
}

// ── title ─────────────────────────────────────────────────────
function leaveTitle() {
  if (titleDone) return;
  if (!assetsReady) return;        // still preloading â€” the button is hidden, but this also
                                   // blocks keyboard / programmatic / dev starts
  titleDone = true;
  // The VO belongs to the loading screen. Whatever happened there — played, or refused by
  // autoplay policy and skipped — this tap must never START it. It only ever fades out a
  // playback still in progress, so the line does not run on under the gameplay music.
  titleStingUsed = true;           // and it can never be started after this point
  stopTitleSting();
  popSound();                      // pop on the start button
  playGameMusic();                 // …and the gameplay music starts, with nothing under it
  const t = document.getElementById('title');
  t.style.display = 'none';        // no shutter — go straight into the game
  startTutorialIntro();
}

// ── tutorial: dragon's welcome intro, then the first customer arrives ──
function startTutorialIntro() {
  if (!tutorial) { walkInClient(); return; }
  // glide out to centre stage first; the welcome box fades in once it has arrived
  glideDragon(() => {
    if (dragonEl)  dragonEl.classList.add('intro');     // dragon stands centre-stage for the welcome
    if (bannerEl)  bannerEl.classList.add('introPos');  // bubble re-anchors above it (still hidden)
  });
  typeBanner('Welcome to the Spooky Juice Stall!');
  typeBanner('The customers will be arriving soon!', null, walkInClient);   // ("thirsty" line removed)
}

// ── client walks in (right → left), then its order pops, then the guide ──
function walkInClient() {
  if (tutorial) {
    // centre stage → resting spot on the right, as ONE uninterrupted glide. The dialogue box
    // and the dragon's talk UI appear together only after it has landed (see glideDragon).
    glideDragon(() => {
      if (dragonEl)  dragonEl.classList.remove('intro');     // dragon moves to its corner
      if (bannerEl)  bannerEl.classList.remove('introPos');  // bubble back to its normal spot
    });
    typeBanner('Look! Our first customer.');
  } else {
    if (dragonEl)  dragonEl.classList.remove('intro');     // (no dragon narration outside the tutorial)
    if (bannerEl)  bannerEl.classList.remove('introPos');
  }
  clientEl.classList.remove('arriving');
  void clientEl.offsetWidth;
  clientEl.classList.add('arriving');
  setTimeout(showThought, 2800);   // after the (slower) walk finishes
}

function showThought() {
  const r = ROUNDS[level];
  setBubbleTop(thoughtEl, r.skin);   // tutorial + solo rounds: sit just above THIS character's head
  thoughtEl.classList.add('show');
  popSound();                       // thought bubble pops
  if (tutorial) {
    // ("This customer wants a full glass." line removed — the order bubble glows during this line instead)
    typeBanner('Let us serve him.',
      () => thoughtEl.classList.add('glow'),                          // glow the order bubble as this line starts
      () => { thoughtEl.classList.remove('glow'); startGame(); });    // line done → begin the guide
  } else {
    setTimeout(startGame, 1400);
  }
}

function hideThought() { thoughtEl.classList.remove('show', 'glow'); }

// ── dialogue line ─────────────────────────────────────────────
// Queue the line: it appears (and its narration plays) only once the previous
// line's audio has fully finished. See pumpDialogue() for the actual display.
let bannerTimer = null;
function typeBanner(text, onDone, onEnd) {
  if (!bannerTxt) { if (onDone) onDone(); if (onEnd) onEnd(); return; }   // keep callback chain alive
  enqueueDialogue(text, onDone, onEnd);
}

// ── start play ────────────────────────────────────────────────
function startGame() {
  if (phase !== 'intro') return;
  phase = 'play';
  checkBtn.style.display = 'none';   // hidden until the first pour
  checkBtn.disabled = true;
  pourBtn.disabled = true;           // POUR stays locked until its instruction appears

  setTimeout(() => {
    if (tutorial) {
      // ("This is an empty glass." line removed — the glass glows during the pour instruction instead)
      glassEl.classList.add('glow');
      typeBanner('Tap the button to pour juice.', () => {
        glassEl.classList.remove('glow');
      }, () => {
        allowPour();                  // unlock pouring AFTER the dragon finishes explaining
        showPourHand();               // …and nudge the POUR button now that it's tappable
      });
    } else {
      // solo rounds: the dragon host has left — there's no narration to wait for,
      // so enable pouring right away. Nothing should sit disabled.
      allowPour();
      showPourHand();
      armPourNudge();               // …and keep nudging if they then sit idle
    }
  }, 700);
}

// hand positions for each guided step
function placeHand()       { moveHand('22%', '69%'); }     // POUR button
// (the "drag the glass to the tray" step uses a ghost glass + glowing tray, not a hand —
//  see showGlassGhost())
// centre the hand nudge exactly on a target element (measured live → exact at any size)
// `force` shows the hand without a dialogue line (used by the idle nudges)
// `dyFrac` shifts the hand DOWN by that fraction of the target's height, so the
// fingertip points at the target from below without covering it (e.g. buttons)
function handToCenterOf(el, force, dyFrac) {
  if (!force && !cueVisible()) { hideHand(); return; }
  const gr = gcEl.getBoundingClientRect();
  const b  = el.getBoundingClientRect();
  handEl.classList.remove('dragHint');
  handEl.style.display = 'block';                    // show first so the hand's size is measurable
  const hw = handEl.offsetWidth, hh = handEl.offsetHeight;
  const dy = b.height * (dyFrac || 0);
  handEl.style.left = ((b.left + b.width  / 2 - gr.left - hw / 2) / gr.width  * 100) + '%';
  handEl.style.top  = ((b.top  + b.height / 2 - gr.top  - hh / 2 + dy) / gr.height * 100) + '%';
}
function handToStrawBox()  { handToCenterOf(strawBox); }   // straw box — hand dead-centre
function handToLemonBox()  { handToCenterOf(lemonBox); }   // lemon box — hand dead-centre
function handToDrag()      { moveHand('60%', '74%', true); } // drag the glass → customer

// ── straw/lemon idle nudge (solo + customer modes) ──────────────
// If the player hasn't tapped a box ~8–10s after the glass lands on the tray,
// glow+pulse the straw box first (with the hand centred on it); once the straw
// is added, the same idle window re-arms to guide them to the lemon box next.
// The tutorial is excluded — it already guides each step immediately.
const BOX_IDLE_MS = 9000;
let boxIdleTimer = null;
function armBoxIdleNudge() {
  cancelBoxIdleNudge();
  if (tutorial || !servedSet || (strawAdded && lemonAdded)) return;
  boxIdleTimer = setTimeout(() => {
    if (!servedSet || tutorial) return;
    if (!strawAdded)      { strawBox.classList.add('glow'); handToCenterOf(strawBox, true); }
    else if (!lemonAdded) { lemonBox.classList.add('glow'); handToCenterOf(lemonBox, true); }
  }, BOX_IDLE_MS);
}
function cancelBoxIdleNudge() {
  if (boxIdleTimer) { clearTimeout(boxIdleTimer); boxIdleTimer = null; }
}

// ── pour ──────────────────────────────────────────────────────
function pour() {
  if (phase !== 'play') return;
  if (pourBtn.disabled) return;     // locked (e.g. dragon is explaining) — ignore taps
  const r = ROUNDS[level];
  // free pouring normally; during the ghost tutorial, stop exactly at the target
  const cap = tutorial ? (r.target === 'half' ? 50 : 100) : 100;
  if (fillPct >= cap) return;

  hasPoured = true;
  removePulse();
  // solo & pair rounds: the glass becomes draggable-to-the-tray as soon as they pour.
  // tutorial: dragging stays locked until the glass is full — see the cap block below.
  if (!tutorial) enableGlassDrag();
  hideHand();                           // pour clicked — remove the hand nudge
  hideGlassGhost();                     // fill changed — drop any stale drag cue
  armPourNudge();                       // re-arm the idle nudge on every pour, any stage

  pourBtn.classList.add('pressed');
  setTimeout(() => pourBtn.classList.remove('pressed'), 140);

  // play the pour sound from the start
  try { pourSound.currentTime = 0; pourSound.play().catch(() => {}); } catch (e) {}

  // flowing pour stream + splash
  stream.classList.remove('pouring');
  void stream.offsetWidth;
  stream.classList.add('pouring');
  setTimeout(() => {
    stream.classList.remove('pouring');
    try { pourSound.pause(); pourSound.currentTime = 0; } catch (e) {}   // animation done — stop the sound
  }, 920);
  spawnSplash();

  fillPct = Math.min(fillPct + STEP, cap);
  setJuice(fillPct);
  if (fillPct >= 100) pourBtn.disabled = true;   // glass is full — disable pouring

  // tutorial half-way beat: on the 2nd tap (50%) pause to teach "half full"
  if (tutorial && fillPct === 50) {
    pourBtn.disabled = true;             // lock the POUR button immediately (no over-pouring)
    glassEl.classList.add('glow');       // glow the glass to draw attention
    clearVoiceQueue();                   // drop any pending line so the beat shows right now
    hideHand();
    typeBanner('The glass is now half full.', null, () => {
      glassEl.classList.remove('glow');  // dialogue finished →
      allowPour();                       //   re-enable the POUR button…
      showPourHand();                    //   …and show the hand nudge on it
    });
    return;                              // skip the generic narration for this tap
  }

  afterPour(r);

  // tutorial: pour freely; once the glass is COMPLETELY FULL, lock POUR.
  // the Check button is revealed by the "The glass is now full." line (see afterPour).
  if (tutorial && fillPct >= 100) {
    pourBtn.disabled = true;             // glass full — no more pouring
    setTimeout(() => { if (phase === 'play') typeBanner('Drag the glass to the tray.',
      () => { glassEl.classList.remove('glow'); enableGlassDrag(true); hideHand(); showGlassGhost(); }); }, 1100);   // cue: ghost glass drifts to the glowing tray
                                              // (true → the drag IS this line's step, so it stays live while it speaks)
  }
}

function afterPour(r) {
  glassEl.classList.remove('glow');   // clear any previous highlight on each new pour
  // re-enable POUR only AFTER the dragon finishes the next instruction (one tap per line)
  const enablePour = () => { allowPour(); };   // never revives POUR on a full glass
  // ── tutorial (first customer, full glass): step-by-step narration ──
  if (tutorial) {
    // the 50% (half-full) beat is handled in pour() before afterPour runs
    if (fillPct >= 100)      typeBanner('The glass is now full.', () => {
      if (cueVisible()) glassEl.classList.add('glow');
      enableGlassDrag();                  // armed here, but INERT until the queue drains / the
                                          // "Drag the glass to the tray." line takes over — a grab
                                          // during this line must not swallow that instruction
    });  // full → no re-enable
    else if (fillPct >= 75)  typeBanner('Tap again!', null, enablePour);
    else                     typeBanner('Keep pouring!', null, enablePour);
    return;
  }
  if (pairMode) return;   // two-client mode: no narration (dragon is gone); just pour freely
  // ── normal single-client rounds ──
  // reaching the target → cue the drop: ghost glass drifts to the glowing tray (no hand)
  // these lines ASK for the drag, so the drag is live while they narrate
  const trayCue = () => { hideHand(); showGlassGhost(); enableGlassDrag(true); };
  if (r.target === 'full') {
    if (fillPct >= FULL_MIN)            typeBanner('Drag the glass to the tray.', trayCue);
    else if (fillPct >= 48 && fillPct <= 52) typeBanner('The glass is now half full.');
    else                                typeBanner('Tap again to pour more juice.');
  } else {
    if (fillPct >= 50) typeBanner('The glass is now half full. Drag the glass to the tray.', trayCue);
    else               typeBanner('Tap again to pour more juice.');
  }
}

// splash droplets where the stream hits the juice surface
function spawnSplash() {
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div');
    d.className = 'splash';
    const sz = 0.5 + Math.random() * 0.7;
    d.style.width = sz + '%';
    d.style.aspectRatio = '1';
    d.style.left = (23.0 + Math.random() * 1.4) + '%';
    d.style.top  = (83 + Math.random() * 2) + '%';
    d.style.setProperty('--dx', ((Math.random() * 2 - 1) * 40).toFixed(0) + 'px');
    d.style.setProperty('--dy', (-(18 + Math.random() * 28)).toFixed(0) + 'px');
    gcEl.appendChild(d);
    setTimeout(() => d.remove(), 560);
  }
}

// ── reward stars: soft glowing SVG stars that twinkle-burst on a correct answer ──
let starSeq = 0;   // unique gradient id per star (so glows never clash)

// build one soft radial-gradient star of the given pixel size
function starEl(size) {
  const gid = 'sg' + (starSeq++);
  const d = document.createElement('div');
  d.className = 'star';
  d.style.width  = size + 'px';
  d.style.height = size + 'px';
  d.innerHTML =
    '<svg viewBox="0 0 100 100" width="100%" height="100%">' +
      '<defs><radialGradient id="' + gid + '" cx="50%" cy="50%" r="55%">' +
        '<stop offset="0%"   stop-color="#FFFFF6" stop-opacity="1"/>' +
        '<stop offset="30%"  stop-color="#FFE68F" stop-opacity=".98"/>' +
        '<stop offset="62%"  stop-color="#FFBA4D" stop-opacity=".6"/>' +
        '<stop offset="100%" stop-color="#FF9E2C" stop-opacity="0"/>' +
      '</radialGradient></defs>' +
      // soft 4-point sparkle — concave curved edges, tips fade out for an eye-friendly glow
      '<path d="M50 2 C53 41 59 47 98 50 C59 53 53 59 50 98 C47 59 41 53 2 50 C41 47 47 41 50 2 Z" ' +
        'fill="url(#' + gid + ')"/>' +
    '</svg>';
  return d;
}

// twinkle burst of N soft stars around (x, y) px inside `container`
function popStar(x, y, container, k) {
  k = k || 1;                          // stage scale so the burst tracks the responsive board
  const N = 10;
  for (let i = 0; i < N; i++) {
    const size = (16 + Math.random() * 30) * k;      // small, delicate
    const s = starEl(size);
    const ang  = Math.random() * Math.PI * 2;
    const dist = Math.random() * 64 * k;             // scattered softly around the point
    const px = x + Math.cos(ang) * dist, py = y + Math.sin(ang) * dist;
    s.style.left = (px - size / 2) + 'px';
    s.style.top  = (py - size / 2) + 'px';
    container.appendChild(s);

    const driftY = -(14 + Math.random() * 44) * k;   // floats upward
    const rot    = Math.random() * 50 - 25;
    const dur    = 820 + Math.random() * 620;
    const delay  = Math.random() * 300;

    s.animate([
      { transform: 'scale(0) rotate(0deg)',           opacity: 0,   offset: 0 },
      { transform: 'scale(1) rotate(' + rot + 'deg)', opacity: .95, offset: .4 },
      { transform: 'translateY(' + driftY + 'px) scale(.55) rotate(' + (rot * 1.6) + 'deg)', opacity: 0, offset: 1 }
    ], { duration: dur, delay: delay, easing: 'cubic-bezier(.25,.7,.4,1)', fill: 'forwards' });

    setTimeout(() => s.remove(), dur + delay + 60);
  }
}

// fire the reward burst over a glass element (defaults to the machine glass)
function spawnRewardStars(targetEl) {
  const el = targetEl || glassEl;
  const cr = el.getBoundingClientRect();
  const gr = gcEl.getBoundingClientRect();
  if (!cr.width || !gr.width) return;
  const cx = cr.left - gr.left + cr.width / 2;
  const cy = cr.top  - gr.top  + cr.height * 0.42;   // over the upper (liquid) part of the glass
  popStar(cx, cy, gcEl, gr.width / 1280);            // center over the glass; scale to the board
}

// ── set juice level ───────────────────────────────────────────
// move the liquid clip: y = bottom (empty) … top (full)
function setJuice(pct) {
  const frac = Math.max(0, Math.min(1, pct / 100));
  const top = 340, bot = 1735;         // liquid surface range inside the glass SVG
  if (fillRect) fillRect.setAttribute('y', (bot - frac * (bot - top)).toFixed(1));
  // completely full → show the polished full-glass art in place of the drawn fill
  if (glassEl) glassEl.classList.toggle('glassIsFull', pct >= 100);
}

// ── on a correct answer: clone the filled glass into a draggable set on the tray ──
let servedSet = null;

// ── tray placement gate ───────────────────────────────────────
// The served drink glides from where it was dropped to its resting spot on the tray (the
// .servedSet left/top transition). Nothing may be announced while that is still running:
// onTrayPlaced() holds a callback until the drink is completely at rest. In the normal flow
// the glide is already over by the time these callbacks are due, so the tutorial's pacing is
// unchanged — this only guarantees the order if a frame hitches or a tap comes early.
const TRAY_PLACE_MS = 850;          // keep in sync with the .servedSet left/top transition
let trayPlacing = false, trayPlaceTimer = null, trayPlaceEnd = null, trayPlaceCbs = [];
function onTrayPlaced(cb) {
  if (!trayPlacing) { cb(); return; }        // already at rest → run now
  trayPlaceCbs.push(cb);
}
// clear the gate without running anything (round reset — the drink is gone)
function resetTrayPlace() {
  if (trayPlaceTimer) { clearTimeout(trayPlaceTimer); trayPlaceTimer = null; }
  trayPlaceEnd = null;
  trayPlacing = false;
  trayPlaceCbs = [];
}
// the drink has settled on the tray → release everything waiting on it
function trayPlaced() {
  if (trayPlaceTimer) { clearTimeout(trayPlaceTimer); trayPlaceTimer = null; }
  trayPlaceEnd = null;
  if (!trayPlacing) return;
  trayPlacing = false;
  const cbs = trayPlaceCbs; trayPlaceCbs = [];
  cbs.forEach(cb => { try { cb(); } catch (e) {} });
}

function serveToTray(startLeft, startTop) {
  glassEl.classList.remove('glow');   // glass is leaving for the tray — stop the highlight (and don't clone it)
  const set = document.createElement('div');
  set.className = 'servedSet';

  servedN++;
  const lvl = pairMode ? servedLevel : ROUNDS[level].target;   // 'full' | 'half'
  // Always CLONE the machine glass — never load an external image. The clone carries the
  // inlined full-glass art with it, so a full order shows the polished art and a half order
  // keeps its exact fill level. Nothing can 404 and nothing has to be fetched, so the served
  // glass is always drawn instantly.
  const clone = glassEl.cloneNode(true);
  clone.removeAttribute('id');
  clone.classList.add('glassImg');
  clone.classList.remove('grabbable', 'dragging', 'glow', 'wrong', 'gone', 'appearIn');
  clone.style.transform = ''; clone.style.transition = '';
  const guide = clone.querySelector('line'); if (guide) guide.remove();   // no half-line on the served glass
  // give the clone's clip a unique id so it freezes at the current fill level
  const cp = clone.querySelector('clipPath');
  if (cp) {
    const nid = 'fillClipServed' + servedN;
    cp.id = nid;
    clone.querySelectorAll('[clip-path]').forEach(g => g.setAttribute('clip-path', 'url(#' + nid + ')'));
    const r = clone.querySelector('rect'); if (r) r.removeAttribute('id');
  }
  // a full order always shows the polished art, even if the drop happened a hair under 100%
  clone.classList.toggle('glassIsFull', lvl === 'full');
  set.appendChild(clone);
  // start over the machine glass by default; when dragged, start where it was dropped
  set.style.left = startLeft || '20.24%';
  set.style.top  = startTop  || '79.4%';
  gcEl.appendChild(set);
  servedSet = set;
  popSound();                  // glass pops onto the tray

  checkBtn.style.display = 'none';   // glass is on the tray — hide the Check button
  // the filled glass "left" onto the tray → reset the machine glass to empty INSTANTLY
  // (no liquid-drain/unfill animation on a correct serve); restore the transition after
  if (fillRect) fillRect.style.transition = 'none';
  setJuice(0);
  if (fillRect) { void fillRect.getBoundingClientRect(); requestAnimationFrame(() => { fillRect.style.transition = ''; }); }
  // the machine slot is now empty (the glass is on the tray) → hide it; a fresh glass
  // re-appears in the slot when the reward coins vanish (see showMachineGlass in rewardCoins)
  hideMachineGlass();
  // …and with no glass under the spout there is nothing to pour into: lock POUR until the
  // drink has been served and a fresh glass drops in (the next round re-enables it)
  pourBtn.disabled = true;
  cancelPourNudge();                 // don't nudge a button the player can't use

  // fly it onto the tray on the next frame so the transition runs. Until it has finished
  // travelling the drink counts as "still being placed" — see onTrayPlaced.
  resetTrayPlace();
  trayPlacing = true;
  trayPlaceEnd = (e) => {
    if (e.target !== set) return;
    if (e.propertyName !== 'left' && e.propertyName !== 'top') return;
    trayPlaced();                                   // landed on the tray
  };
  set.addEventListener('transitionend', trayPlaceEnd);
  // safety net: if the glide never runs or the event is missed, treat it as placed anyway
  trayPlaceTimer = setTimeout(trayPlaced, TRAY_PLACE_MS + 250);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    set.style.left = '58.5%';
    set.style.top  = '73%';
  }));

  // (the reward star burst now fires on the machine glass at Check time — see onSuccess/checkPair)

  // once it has landed, invite the player to add a straw (onTrayPlaced keeps the prompt from
  // ever landing on the tail of the glide — the 950ms beat itself is unchanged)
  strawAdded = false; lemonAdded = false;
  setTimeout(() => onTrayPlaced(() => {
    if (tutorial) {
      // tutorial: guided — straw first
      typeBanner('Tap on the straws.', () => {
        strawBox.style.pointerEvents = 'auto';
        if (cueVisible()) strawBox.classList.add('glow');
        handToStrawBox();
      });
    } else {
      // solo rounds (full or half): either box may be tapped first — enable BOTH
      strawBox.style.pointerEvents = 'auto';
      lemonBox.style.pointerEvents = 'auto';
      armBoxIdleNudge();   // idle ~9s with no tap → glow + hand nudge on the straw box first
    }
  }), 950);
}

// player clicked the glowing straw box → drop a straw into the served glass,
// then the lemon box starts glowing
// an ingredient flies from its box into the served glass, then `done()` runs
function flyToGlass(imgSrc, fromEl, done) {
  if (!servedSet || !fromEl) { if (done) done(); return; }
  const fr = gcEl.getBoundingClientRect();
  const a = fromEl.getBoundingClientRect();
  const L = px => ((px - fr.left) / fr.width * 100) + '%';
  const T = px => ((px - fr.top) / fr.height * 100) + '%';
  const fly = document.createElement('img');
  fly.src = imgSrc;
  fly.className = 'flyStraw';
  fly.style.left = L(a.left + a.width / 2);
  fly.style.top  = T(a.top + a.height / 2);
  gcEl.appendChild(fly);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (!servedSet) { fly.remove(); if (done) done(); return; }
    const b = servedSet.getBoundingClientRect();
    fly.style.left = L(b.left + b.width / 2);
    fly.style.top  = T(b.top + b.height * 0.25);
    fly.style.transform = 'translate(-50%,-50%) scale(0.55) rotate(-12deg)';
  }));
  setTimeout(() => { fly.remove(); if (done) done(); }, 220);   // fast: composite lands quickly
}

// finished-drink composite art per order. Either box may be tapped first:
//   1st ingredient (straw OR lemon) → "<glass> with <that ingredient>"
//   2nd ingredient (the other box)  → "complete <glass>" → ready to serve
const COMPOSITES = {
  full: {
    straw:    'new assets/full glass with  strow.webp',
    lemon:    'new assets/full glass with lemon.webp',
    complete: 'new assets/complete full glass.webp'
  },
  half: {
    straw:    'new assets/main bg/half glass with strow ..webp',
    lemon:    'new assets/main bg/half glass with lemon.webp',
    complete: 'new assets/main bg/complete the half glass.webp'
  }
};
// Each composite SVG has different padding around the glass (the straw pokes up,
// the lemon pokes left), so a one-size 135% would make the glass JUMP on every
// swap. These offsets — measured from the glass paths inside each SVG — scale and
// shift each composite so its glass lands exactly on the plain glass footprint
// (full box height, bottom-aligned, horizontally centred).
//   h  = image height (% of the servedSet box)
//   b  = image bottom offset (% of the box)
//   cx = translateX (% of the image's own width) putting the glass centre at box centre
const COMPOSITE_POS = {
  full: {
    straw:    { h: '137.34%', b: '1.43%',  cx: '-31.97%' },
    lemon:    { h: '137.25%', b: '1.51%',  cx: '-39.05%' },
    complete: { h: '137.25%', b: '1.51%',  cx: '-39.05%' }
  },
  half: {
    straw:    { h: '141.58%', b: '-0.62%', cx: '-31.31%' },
    lemon:    { h: '141.58%', b: '-0.62%', cx: '-41.37%' },
    complete: { h: '141.58%', b: '-0.62%', cx: '-41.37%' }
  }
};
// build a composite <img> with its glass aligned to the plain glass footprint
function makeCompositeImg(target, key) {
  const img = document.createElement('img');
  img.className = 'compositeImg';
  img.src = (COMPOSITES[target] || COMPOSITES.full)[key];
  const pos = (COMPOSITE_POS[target] || COMPOSITE_POS.full)[key];
  img.style.setProperty('--comp-h',  pos.h);
  img.style.setProperty('--comp-b',  pos.b);
  img.style.setProperty('--comp-cx', pos.cx);
  return img;
}
function compositeAdd(which) {            // which = 'straw' | 'lemon'
  if (!servedSet) return;
  const g = servedSet.querySelector('.glassImg');
  const both = strawAdded && lemonAdded;  // both boxes now tapped → completed drink
  const target = pairMode ? servedLevel : ROUNDS[level].target;   // pair mode: the drink's own level
  const prev = servedSet.querySelector('.compositeImg');
  const img = makeCompositeImg(target, both ? 'complete' : which);
  servedSet.appendChild(img);
  // the new composite pops in from opacity 0 (and may need a frame to decode), so
  // keep the OLD art visible underneath until it has fully landed — hiding it up
  // front left a blank gap for a few frames (the glass "blinked"). The artwork is
  // footprint-aligned, so the overlap reads as a seamless crossfade.
  const ready = img.decode ? img.decode().catch(() => {}) : Promise.resolve();
  const popIn = new Promise(res => {
    img.addEventListener('animationend', res, { once: true });
    setTimeout(res, 350);                 // fallback in case the animation never fires
  });
  Promise.all([ready, popIn]).then(() => {
    if (g) g.style.visibility = 'hidden'; // composite depicts the whole glass — hide the plain one
    if (prev) prev.remove();              // swap out the single-ingredient art
  });
  popSound();
  if (both) {
    // second ingredient in → ready to drag to the customer ("Juice is ready!" line removed)
    if (tutorial) {
      setTimeout(enableServeDrag, 150);   // the drag guide comes up right as the lemon lands
                                          // (was 600ms — too long a wait after the tap)
    } else {
      enableServeDrag();
    }
  }
}

function addStrawToServed() {
  if (strawAdded || !servedSet) return;
  strawAdded = true;
  cancelBoxIdleNudge();             // player acted — drop any pending idle nudge
  hideHand();                       // straw tapped — clear the straw-box hand cue
  strawBox.classList.remove('glow');
  strawBox.style.pointerEvents = 'none';
  popSound();                       // a straw lifts out of the box

  // straw flies from the box into the glass, then the composite lands
  flyToGlass('new assets/strow.webp', strawBox, () => {
    if (!servedSet) return;
    compositeAdd('straw');
    // tutorial only: after the straw lands, guide the player to the lemon box
    if (tutorial && !lemonAdded) {
      setTimeout(() => {
        typeBanner('Tap on the lemons.', () => {
          lemonBox.style.pointerEvents = 'auto';
          if (cueVisible()) lemonBox.classList.add('glow');
          handToLemonBox();
        });
      }, 250);
    } else if (!lemonAdded) {
      armBoxIdleNudge();            // solo/pair: re-arm — idle ~9s more → nudge the lemon box next
    }
  });
}

// player clicked the glowing lemon box → drop a lemon slice on the glass,
// then the finished drink becomes draggable to the customer
function addLemonToServed() {
  if (lemonAdded || !servedSet) return;
  if (tutorial && !strawAdded) return;   // tutorial forces straw-first (guided); solo allows either box first
  lemonAdded = true;
  cancelBoxIdleNudge();             // player acted — drop any pending idle nudge
  // "Tap on the lemons." has just been obeyed, and it is a silent prompt sitting out a ~3.2s
  // reading hold. Release it the moment the box is tapped so "Drag the juice to the customer."
  // comes up straight away instead of waiting for a prompt the player has already answered.
  if (tutorial) finishCurrentLine();
  hideHand();                       // lemon tapped — clear the lemon-box hand cue
  lemonBox.classList.remove('glow');
  lemonBox.style.pointerEvents = 'none';
  popSound();                       // a lemon lifts out of the box

  // lemon flies from the box into the glass, then the composite lands
  flyToGlass('new assets/lemon.svg', lemonBox, () => {
    if (!servedSet) return;
    compositeAdd('lemon');
    if (!strawAdded && !tutorial) armBoxIdleNudge();   // lemon-first: re-arm to nudge the straw box next
  });
}

function clearServed() {
  cancelDragIdleNudge();
  cancelBoxIdleNudge();
  resetTrayPlace();                 // the drink is gone — drop any pending placement gate
  if (servedSet) { servedSet.remove(); servedSet = null; }
  strawBox.classList.remove('glow'); strawBox.style.pointerEvents = 'none';
  lemonBox.classList.remove('glow'); lemonBox.style.pointerEvents = 'none';
  strawAdded = false; lemonAdded = false;
}

// ── drag the finished drink onto the customer to serve them ──
let dragActive = false, dragStartX = 0, dragStartY = 0;

// ── drag the FILLED machine glass onto the tray (replaces the old Check button) ──
// Dropping it on the tray validates the fill: right order → it settles onto the tray and
// the straw/lemon step begins; wrong order → it glides back with a "try again" shake.
let glassDraggable = false, glassDragActive = false, glassDragSX = 0, glassDragSY = 0;
// true only when the line currently speaking is the one asking for the drag (see enableGlassDrag)
let glassDragIsTheStep = false;

// hide the pour glass while a drink is out being served; re-show it (a fresh glass drops
// into the slot) exactly when the reward coins vanish — see rewardCoins.
function hideMachineGlass() { hideGlassGhost(); glassEl.classList.remove('appearIn'); glassEl.classList.add('gone'); }
// Has the LAST customer been served? Nobody left waiting and nobody left to spawn. From that
// point the cycle is on its way into the completion sequence, so the machine must not prepare
// another glass — it would just sit unused under the spout while the end screen comes up.
// Only ever true in customer (pair) mode: the tutorial and the solo rounds always have a next
// customer, so their fresh-glass behaviour is untouched.
function noCustomersLeft() {
  if (phase === 'gameover') return true;                 // completion flow already started
  if (!pairMode) return false;
  if (qIndex < customerOrder.length) return false;       // more are still due to arrive
  if (queue.length === 0) return true;                   // line empty, nothing left to come
  // The customer mid-delivery holds their lane until they have walked off, so "the only one
  // left is one who has ALREADY been served" is still the last customer. `served` is what
  // separates that from the next customer waiting for their drink: testing phase === 'leaving'
  // instead (as this did at first) wrongly suppressed the glass during the second-to-last
  // delivery — by the time the coins fade, the served customer has been shifted out of the
  // queue and queue[0] is the final, UNSERVED customer, who still needs a glass.
  return queue.length === 1 && !!queue[0].served;
}
function showMachineGlass() {
  if (noCustomersLeft()) return;            // final customer served → no new glass, no pop-in
  glassEl.classList.remove('gone', 'appearIn');
  void glassEl.offsetWidth;                 // restart the pop-in animation
  glassEl.classList.add('appearIn');
  setTimeout(() => glassEl.classList.remove('appearIn'), 520);
}

// ── "drag the glass to the tray" cue ──────────────────────────
// A faint clone of the filled glass drifts from the machine to the tray on a loop, and the
// tray glows as the drop target. This replaces the hand nudge for this step.
let glassGhostEl = null;
function showGlassGhost() {
  hideGlassGhost();
  if (!glassEl || glassEl.classList.contains('gone')) return;
  const trayEl = document.getElementById('tray');
  if (!trayEl) return;
  const ghost = glassEl.cloneNode(true);         // same glass, same fill level
  ghost.removeAttribute('id');
  ghost.classList.remove('grabbable', 'dragging', 'glow', 'wrong', 'appearIn');
  // strip the clip-path id collision: give this clone its own so its fill renders
  const cp = ghost.querySelector('clipPath');
  if (cp) {
    const nid = 'fillClipGhost' + (++servedN);
    cp.id = nid;
    ghost.querySelectorAll('[clip-path]').forEach(g => g.setAttribute('clip-path', 'url(#' + nid + ')'));
    const r = ghost.querySelector('rect'); if (r) r.removeAttribute('id');
  }
  // measure the real machine→tray journey so the ghost lands on the tray at any screen size
  const gr = glassEl.getBoundingClientRect();
  const tr = trayEl.getBoundingClientRect();
  const dx = (tr.left + tr.width / 2) - (gr.left + gr.width / 2);
  const dy = (tr.top + tr.height * 0.42) - (gr.top + gr.height / 2);
  ghost.style.setProperty('--ggx', (dx / gr.width  * 100).toFixed(1) + '%');
  ghost.style.setProperty('--ggy', (dy / gr.height * 100).toFixed(1) + '%');
  ghost.classList.add('glassGhost');
  gcEl.appendChild(ghost);
  glassGhostEl = ghost;
  trayEl.classList.add('glow');                  // the tray glows as the drop target
}
function hideGlassGhost() {
  if (glassGhostEl) { glassGhostEl.remove(); glassGhostEl = null; }
  const trayEl = document.getElementById('tray');
  if (trayEl) trayEl.classList.remove('glow');
}

// `isTheStep = true` means dragging is the action the CURRENT dialogue line is asking for
// ("Drag the glass to the tray."), so the drag stays live while that line narrates. Called
// without it (e.g. from "The glass is now full."), the glass is armed but stays inert until
// the whole dialogue sequence has finished — a grab must never skip the remaining lines.
function enableGlassDrag(isTheStep) {
  glassDraggable = true;
  if (isTheStep) glassDragIsTheStep = true;
  refreshGlassGrab();
}
function disableGlassDrag() {
  glassDraggable = false; glassDragActive = false; glassDragIsTheStep = false;
  glassEl.classList.remove('grabbable', 'dragging');
  glassEl.style.transition = ''; glassEl.style.transform = '';
  hideGlassGhost();                   // no drag → no ghost cue / tray glow
}
// May the glass be grabbed right now? `.grabbable` is what gives it pointer-events, so
// toggling the class both gates the tap and keeps the cursor honest about it.
function glassGrabAllowed() {
  return glassDraggable && (glassDragIsTheStep || !dialogueBlocking());
}
function refreshGlassGrab() {
  if (!glassEl) return;
  if (glassDragActive) return;                 // mid-drag — never yank it out of the player's hand
  glassEl.classList.toggle('grabbable', glassGrabAllowed());
}
// glide the machine glass back to its home spot, then run `then` (used by the wrong-drop shake)
function snapGlassHome(then) {
  glassEl.style.transition = 'transform 0.3s ease';
  glassEl.style.transform  = 'translate(0,0)';
  setTimeout(() => {
    glassEl.style.transition = ''; glassEl.style.transform = '';
    glassEl.classList.remove('dragging');   // back home → drop it back to its normal layer
    if (then) then();
  }, 300);
}
function onGlassDown(e) {
  if (!glassDraggable || !hasPoured || phase !== 'play') return;
  // The dragon is still talking (or has lines queued) and this drag is not what it asked for
  // → ignore the grab completely. It must not skip, cut short, or reorder the narration.
  // Repeated / rapid taps all land here, so no amount of clicking gets past the sequence.
  if (!glassGrabAllowed()) { refreshGlassGrab(); return; }
  e.preventDefault();
  glassDragActive = true;
