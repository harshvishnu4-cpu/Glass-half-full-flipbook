<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ready Set Serve!</title>
<!-- inline favicon: a data: URI costs no request, and kills the /favicon.ico 404 that
     otherwise fires on every single load -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a0f3a'/%3E%3Cpath d='M9 7h14l-1.6 17.5a2.4 2.4 0 0 1-2.4 2.2h-6a2.4 2.4 0 0 1-2.4-2.2z' fill='%23F0EDE6'/%3E%3Cpath d='M10.1 13h11.8l-1 11.4a2.4 2.4 0 0 1-2.4 2.2h-5a2.4 2.4 0 0 1-2.4-2.2z' fill='%23F77ADE'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- only the weights the page actually renders (500/600/700/800); 400 and 900 were requested
     but never used, so they were dropped from the font request -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* nothing in the game may be drag-copied or selected — the glass uses its own
   pointer-based drag (see .servedSet), which is unaffected by this. */
img, svg, button {
  -webkit-user-drag: none;
  -webkit-user-select: none;
  user-select: none;
}

body {
  background: #15071f;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  /* mobile hardening, all of it inert on desktop:
     • overscroll-behavior — no pull-to-refresh or rubber-band drag while dragging a glass
     • touch-action: manipulation — kills the double-tap-to-zoom that iOS Safari still allows
       even with user-scalable=no (it ignores that flag). The two drag surfaces override this
       with `none`, which is more specific, so dragging is unaffected.
     • tap-highlight — removes the grey flash iOS paints over a tapped button */
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
/* Mobile browser chrome makes 100vh LARGER than the visible area (it measures the viewport
   with the toolbar retracted), so on a phone the board's bottom — the counter, the tray, the
   POUR button — sat under the toolbar. dvh tracks the area that is actually visible.
   Declared after the vh rules above so browsers without dvh keep exactly what they had. */
@supports (height: 100dvh) {
  body { min-height: 100dvh; }
}

/* ── canvas (16:9, design space 1920×1080) ── */
#gc {
  position: relative;
  /* the largest 16:9 rectangle that fits the viewport on BOTH axes, centred by
     the fl​ex body → letterboxes on tall screens, pillarboxes on wide screens */
  width: min(100vw, calc(100vh * 16 / 9));
  height: min(56.25vw, 100vh);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  user-select: none;
  /* touch: the board itself must not pan or zoom under a finger (the drag surfaces set their
     own `none`; this stops a stray swipe on the counter from scrolling the page instead) */
  touch-action: manipulation;
  /* make the board a query container so every inner size that uses `cqw`
     scales with the BOARD width, not the viewport width. This keeps the whole
     layout consistent on ultra-wide, short-landscape and pillarboxed screens
     where the board no longer spans the full viewport width. */
  container-type: inline-size;
}
/* Same board, measured against the SAFE area instead of the raw viewport: dvh for the mobile
   toolbar, and env(safe-area-inset-*) so a notch, a rounded corner or the home indicator can
   never sit over the board (the page opts into the full screen with viewport-fit=cover, so
   without this the insets are ours to lose). Both units are gated behind @supports, and this
   block only ever SHRINKS the board — on any browser or device without notches the maths
   resolves to the same numbers as the plain vw/vh rules above. */
@supports (width: 100dvw) and (padding: env(safe-area-inset-left)) {
  #gc {
    --safe-w: calc(100dvw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    --safe-h: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    width:  min(var(--safe-w), calc(var(--safe-h) * 16 / 9));
    height: min(calc(var(--safe-w) * 9 / 16), var(--safe-h));
  }
}

/* ── rotate-to-landscape prompt (shown on portrait screens; the game is 16:9) ── */
#rotate { display: none; }
@media (orientation: portrait) {
  #rotate {
    display: flex;
    position: fixed; inset: 0;
    z-index: 100000;              /* above everything, incl. the dev menu */
    flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    background: #15071f;
    color: #ffeede;
    padding: 8vw;
    font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  }
  #rotate .ico { font-size: 20vw; line-height: 1; animation: rotateHint 2s ease-in-out infinite; }
  #rotate p { margin-top: 6vw; font-size: clamp(15px, 4.6vw, 30px); font-weight: 700; width: 84vw; }
}
@keyframes rotateHint { 0%,20% { transform: rotate(0deg); } 60%,100% { transform: rotate(90deg); } }

/* ── full-scene circus background (GAME BG.svg) ── */
#bgFull {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

/* ════════════════════════════════════════════════════════════
   All element positions are expressed as % of the 1920×1080
   design, taken straight from the Figma frame (660:6204).
   Tweak any value here if an asset needs nudging.
   ════════════════════════════════════════════════════════════ */

/* ── client (monster standing behind the counter) ── */
#client {
  position: absolute;
  left: 55%;                  /* center-stage, between the machine and the dragon host */
  bottom: 42%;                /* lower body tucks behind the counter overlay */
  width: 12.8%;               /* uniform footprint — every customer is the same size */
  height: 40%;
  transform: translateX(-50%);
  object-fit: contain;        /* scale each character to fit the box, undistorted */
  z-index: 3;                 /* behind #counterFront (z4) so it stands behind the bar */
  pointer-events: none;
  opacity: 0;                 /* hidden until it walks in */
  filter: drop-shadow(0 10px 16px rgba(0,0,0,0.45));
  transform-origin: center bottom;
}
/* the client walks in from the right, then floats in place */
#client.arriving, #client2.arriving, #client3.arriving {
  opacity: 1;
  animation: ghostWalkIn 2.8s ease-out both,
             clientFloat 3.2s ease-in-out 2.8s infinite;
}
#client.cheer { animation: clientCheer 0.6s ease; }
@keyframes clientFloat {
  0%,100% { transform: translateX(-50%) translateY(0);     }
  50%     { transform: translateX(-50%) translateY(-2.5%); }
}
/* right-to-left entrance with a little walking bob + sway */
@keyframes ghostWalkIn {
  0%   { transform: translateX(520%) translateY(0)   rotate(0deg);  opacity: 0; }
  12%  { opacity: 1; }
  30%  { transform: translateX(330%) translateY(-5%) rotate(-3deg); }
  45%  { transform: translateX(210%) translateY(0)   rotate(3deg);  }
  60%  { transform: translateX(110%) translateY(-5%) rotate(-3deg); }
  78%  { transform: translateX(20%)  translateY(0)   rotate(2deg);  }
  90%  { transform: translateX(-60%) translateY(-3%) rotate(-1deg); }
  100% { transform: translateX(-50%) translateY(0)   rotate(0deg);  opacity: 1; }
}
@keyframes clientCheer {
  0%,100% { transform: translateX(-50%) translateY(0)   scale(1);    }
  45%     { transform: translateX(-50%) translateY(-8%) scale(1.07); }
}
/* happy customer floats out to the left and off the frame */
#client.leavingLeft, #client2.leavingLeft, #client3.leavingLeft { opacity: 1; animation: clientExitLeft 1s ease-in both; }
@keyframes clientExitLeft {
  0%   { transform: translateX(-50%)  translateY(0);   opacity: 1; }
  100% { transform: translateX(-720%) translateY(-3%); opacity: 0; }
}

/* ── extra customer slots (post-tutorial: up to 3 customers at once) ── */
#client2, #client3 {
  position: absolute;
  left: 70%;
  bottom: 42%;
  width: 12.8%;               /* same uniform footprint as #client */
  height: 40%;
  transform: translateX(-50%);
  object-fit: contain;
  z-index: 3;                 /* behind the counter, like #client */
  pointer-events: none;
  opacity: 0;
  display: none;
  filter: drop-shadow(0 10px 16px rgba(0,0,0,0.45));
  transform-origin: center bottom;
}

/* all customer slots: standing idle float, cheer, poof */
#client.standing, #client2.standing, #client3.standing { opacity: 1; animation: clientFloat 3.2s ease-in-out infinite; }
#client2.cheer, #client3.cheer { animation: clientCheer 0.6s ease; }
#client.poof, #client2.poof, #client3.poof { animation: clientPoof 0.85s ease-in forwards; }
@keyframes clientPoof {
  0%   { opacity: 1; transform: translateX(-50%) translateY(0)    scale(1);    }
  40%  { opacity: 1; transform: translateX(-50%) translateY(-6%)  scale(1.08); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-14%) scale(0.85); }
}

/* counter frame (new counter.png) — a full-screen foreground overlay with a transparent
   window: customers + sky show through it, and its opaque counter bar hides their lower body.
   The art's ledge sits at ~49% but the scene's counter line is at ~52.3%, so the image is
   stretched slightly taller (top-anchored: curtains stay put, ledge drops onto the counter
   line, extra floor is cropped below the board). Tune `height` to nudge the ledge. */
#counterFront {
  position: absolute;
  left: 0;
  top: -2.5%;                 /* raised above natural — ledge ≈ 46.5% (curtains rise slightly too) */
  width: 100%;
  height: 102.5%;             /* keeps the floor reaching the bottom edge of the board */
  object-fit: fill;
  z-index: 4;
  pointer-events: none;
}

/* ── dragon host (agni) — permanent narrator, bottom-right behind the bar ── */
#dragon {
  position: absolute;
  left: 68.44%;
  top: 33.11%;
  width: 59.02%;
  height: 78.46%;
  object-fit: contain;
  z-index: 9;                 /* in front of the counter (z4) — stands beside the bar, fully visible */
  pointer-events: none;
  transform-origin: center bottom;
  /* every position change is one slow, symmetric ease-in/ease-out glide — it accelerates and
     settles instead of snapping. The bubble below uses the SAME duration and curve so the
     dragon and its dialogue box always travel as one group. Keep DRAGON_MOVE_MS in sync. */
  transition: left 0.9s cubic-bezier(0.45, 0.05, 0.55, 0.95),
              top  0.9s cubic-bezier(0.45, 0.05, 0.55, 0.95),
              width 0.9s cubic-bezier(0.45, 0.05, 0.55, 0.95);
}
/* welcome intro — dragon stands centre-stage, then moves to its corner */
#dragon.intro { left: 34%; top: 35%; }
/* end of tutorial — the dragon host slides off to the right, then is removed */
#dragon.exitRight { animation: dragonExitRight 1s ease-in forwards; }
@keyframes dragonExitRight {
  0%   { transform: translateX(0)    rotate(0deg); opacity: 1; }
  100% { transform: translateX(115%) rotate(8deg); opacity: 0; }
}
/* mid-game hint (2+ wrong Check attempts): the dragon briefly slides back in
   to its resting spot to give a pour-count tip, then leaves again via .exitRight */
#dragon.hintIn { animation: dragonHintIn 0.8s ease-out both; }
@keyframes dragonHintIn {
  0%   { transform: translateX(115%) rotate(8deg); opacity: 0; }
  100% { transform: translateX(0)    rotate(0deg); opacity: 1; }
}

/* ── dragon's speech bubble ───────────────────────────────────────
   Shape follows `new assets/Union.svg`: a softly rounded cream capsule with an orange rim.
   That reference body is 552.66 × 164.67 with a 56 corner radius — 34% of its height — so the
   radius below is 2cqw, ≈35% of a one-line bubble, which lands on the same roundness.
   It stays CSS-drawn rather than using the SVG as a background image. The box hugs its text
   (width: max-content) and grows a line at a time, and any artwork stretched to that changing
   size would distort precisely the corners and rim the reference is defined by. A border-radius
   cannot stretch: the corners stay true at every size and every line count, and the padding
   stays equal on all four sides. Fill and rim colours are taken straight from the file.
   Position, size rules, padding, font, text styling, the tail and the animations are unchanged. */
#dragonBubble {
  position: absolute;
  left: 86.83%;                /* anchored by centre so the bubble stays put as text changes */
  top: 21.67%;
  transform: translateX(-50%);
  /* same duration + curve as #dragon → the box never drifts out of step with the dragon */
  transition: left 0.9s cubic-bezier(0.45, 0.05, 0.55, 0.95),
              top  0.9s cubic-bezier(0.45, 0.05, 0.55, 0.95);
  width: max-content;          /* hug the text … */
  max-width: 19%;              /* … up to a sensible cap, then wrap onto more lines */
  background: #FEF3DD;         /* cream fill — Union.svg */
  border: 0.5cqw solid #FF8701; /* orange rim — Union.svg (weight unchanged) */
  border-radius: 2cqw;         /* the reference's 34%-of-height corner */
  filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1.1em 1.3em;        /* inner padding on all sides */
  z-index: 16;
  pointer-events: none;
  color: #2a2a2a;
  font-weight: 600;
  font-size: 1.35cqw;
  line-height: 1.28;
  text-align: center;
  word-break: normal;
  overflow-wrap: break-word;
}
#dragonBubble.show { display: flex; animation: bubbleFade 0.25s ease; }
/* welcome intro — bubble sits above the centre-stage dragon */
#dragonBubble.introPos { left: 55%; top: 22%; }
@keyframes bubbleFade { from { opacity: 0; transform: translateX(-50%) scale(0.92); }
                          to { opacity: 1; transform: translateX(-50%) scale(1); } }
/* little tail pointing down toward the dragon (orange rim + peach fill) */
#dragonBubble::before, #dragonBubble::after {
  content: '';
  position: absolute;          /* absolute → not a flex item, won't shift the text */
  top: 100%;
  left: 58%;                   /* tail points down toward the dragon (below-right) */
  width: 0; height: 0;
  border: 0.95cqw solid transparent;
}
/* same tail, same spot — only its two colours follow the box's new fill and rim */
#dragonBubble::before { transform: translateX(-50%);              border-top-color: #FF8701; }
#dragonBubble::after  { transform: translateX(-50%) translateY(-0.3cqw); border-width: 0.72cqw; border-top-color: #FEF3DD; }
#dragonText.typing::after {
  content: '|';
  color: #FEF3DD;              /* matches the fill → reserves the caret's width, stays invisible */
  animation: caretBlink 0.6s step-end infinite;
}
/* the not-yet-typed tail stays in the layout (just invisible) so the bubble
   reserves its final size from the first character and never resizes mid-type */
#dragonText .untyped { visibility: hidden; }
/* emphasised words inside the dragon's bubble (empty glass / half full / full) */
#dragonText b { font-weight: 800; }

/* ── thought bubble (the client's order) — uses dailoge box.svg ── */
/* How high a box sits is set in JS, per character, because every sprite's head lands at a
   different height inside the shared customer box — see BUBBLE_TOP / setBubbleTop(). The
   value here is only the fallback for a skin that isn't in that table: the tightest of the
   measured tops, so it can never overlap anyone. */
#thought {
  position: absolute;
  left: 45.5%;                /* TUTORIAL position (customer mode overrides this via QUEUE_POS inline styles) */
  top: 3.1%;                  /* fallback only — setBubbleTop() sets the real value per skin */
  width: 7.27%;
  aspect-ratio: 281 / 382;
  display: none;
  z-index: 16;
}
#thought.show { display: block; animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1), thoughtFloat 2.8s ease-in-out 0.4s infinite; }
@keyframes thoughtFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3.5%); } }
#thoughtBg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,0.3));
}
/* the order bubble glows while the dragon says "This customer wants a full glass." */
#thought.glow #thoughtBg { animation: thoughtGlow 0.9s ease-in-out infinite; }
@keyframes thoughtGlow {
  0%,100% { filter: drop-shadow(0 8px 18px rgba(0,0,0,0.3)) drop-shadow(0 0 6px rgba(255,215,0,0.6)); }
  50%     { filter: drop-shadow(0 8px 18px rgba(0,0,0,0.3)) drop-shadow(0 0 22px rgba(255,215,0,1)); }
}
/* content sits inside the rounded box (top-left 82.6% × 85.9% of the svg) */
#thoughtInner {
  position: absolute;
  left: 0; top: 0;
  width: 82.6%; height: 85.9%;
  display: flex;
  flex-direction: column;
  align-items: center;       /* glass + label horizontally centered */
  justify-content: center;   /* …and the group vertically centered */
  text-align: center;
  padding: 6%;
  gap: 3%;
  font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  font-weight: 500;          /* Poppins Medium for the customer's order text */
}
@keyframes popIn {
  0%   { transform: scale(0);   opacity: 0; }
  100% { transform: scale(1);   opacity: 1; }
}

/* ── extra order bubbles (customer slots 2 & 3) — IDENTICAL to #thought ── */
#thought2, #thought3 {
  position: absolute;
  left: 63%;                  /* overridden per-lane by QUEUE_POS in customer mode */
  top: 3.1%;                  /* fallback only — setBubbleTop() sets the real value per skin */
  width: 7.27%;
  aspect-ratio: 281 / 382;
  display: none;
  z-index: 16;
}
#thought2.show, #thought3.show { display: block; animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1), thoughtFloat 2.8s ease-in-out 0.4s infinite; }
#thoughtBg2, #thoughtBg3 {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,0.3));
}
/* same attention-glow as #thought — used for the 2+ wrong-Check hint in customer mode */
#thought2.glow #thoughtBg2, #thought3.glow #thoughtBg3 { animation: thoughtGlow 0.9s ease-in-out infinite; }
#thoughtInner2, #thoughtInner3 {
  position: absolute;
  left: 0; top: 0;
  width: 82.6%; height: 85.9%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 6%;
  gap: 3%;
  font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  font-weight: 500;          /* Poppins Medium for the customer's order text */
}

@keyframes caretBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* ── pink pour machine (left) ── */
#machine {
  position: absolute;
  left: 9.51%;
  top: 25.89%;
  width: 28.22%;
  height: 72.16%;
  object-fit: contain;
  z-index: 5;
  pointer-events: none;
  filter: drop-shadow(0 12px 20px rgba(0,0,0,0.4));
}
#machine.shake { animation: machineShake 0.4s ease; }
@keyframes machineShake {
  0%,100% { transform: translateX(0); }
  25%     { transform: translateX(-1.2%) rotate(-0.6deg); }
  75%     { transform: translateX(1.2%)  rotate(0.6deg);  }
}

/* ── glass (sits in the machine's dispensing slot) ── */
#glass {
  position: absolute;
  left: 20.24%;       /* centered under the machine spout */
  top: 76.79%;
  width: 6.7%;
  height: 15.2%;
  /* z9 — ABOVE the tray (z8). At z6 the tray painted over the glass wherever the two
     overlapped: only .dragging lifted it (z40), so any moment the glass sat over the tray
     without that class (the frame the drag ends, the glide home, a cancelled pointer) clipped
     it behind the tray. z9 makes it unconditional, in every state.
     Nothing that overlaps the glass moves: the pour stream, its splash droplets and the
     drag-hint ghost clone are all z9 too and come later in paint order, so they still draw
     over the glass exactly as before. */
  z-index: 9;
  pointer-events: none;
}
/* completely-full look: swap the drawn glass (body + rising liquid + half-line) for the
   polished full-glass art. Driven by the .glassIsFull CLASS (not the #glass id) so that
   CLONES of the glass — the one served onto the tray, the drag-hint ghost — show the same
   art without needing an external image file. */
.glassFullArt { display: none; }
.glassIsFull > .glassFullArt { display: block; }
.glassIsFull > path,
.glassIsFull > g,
.glassIsFull > line { visibility: hidden; }
/* tutorial highlight — empty glass pulses with a golden glow */
#glass.glow { animation: glassGlow 0.9s ease-in-out infinite; transform-origin: center bottom; }
@keyframes glassGlow {
  0%,100% { filter: drop-shadow(0 0 4px rgba(255,215,0,0.55)); transform: scale(1); }
  50%     { filter: drop-shadow(0 0 18px rgba(255,215,0,1)) drop-shadow(0 0 9px rgba(255,215,0,0.9)); transform: scale(1.06); }
}
/* wrong answer — glass glows red and shakes */
#glass.wrong {
  animation: glassShake 0.5s ease-in-out;   /* shake only — no red glow */
}
@keyframes glassShake {
  0%,100% { transform: translateX(0)    rotate(0deg);    }
  18%     { transform: translateX(-7px) rotate(-2.5deg); }
  36%     { transform: translateX(7px)  rotate(2.5deg);  }
  54%     { transform: translateX(-5px) rotate(-1.5deg); }
  72%     { transform: translateX(5px)  rotate(1.5deg);  }
  88%     { transform: translateX(-2px) rotate(0deg);    }
}
/* smooth rising liquid */
#fillRect { transition: y 0.75s cubic-bezier(0.25,0.46,0.45,0.94); }

/* the rising pink liquid is now handled inside the glass SVG (fillRect clip) */

/* a served glass clone that flies onto the tray on a correct answer */
/* the served drink (glass + straw + lemon) — flies to the tray, then is draggable to the customer */
.servedSet {
  position: absolute;
  width: 6.7%;
  height: 12.2%;
  z-index: 10;
  pointer-events: none;
  filter: drop-shadow(0 10px 16px rgba(0,0,0,0.45));
  transform-origin: center bottom;
  transition: left 0.85s cubic-bezier(0.34,1.05,0.5,1),
              top  0.85s cubic-bezier(0.5,-0.25,0.6,1);
}
.servedSet .glassImg { position: absolute; inset: 0; width: 100%; height: 100%; }
.servedSet.draggable { pointer-events: auto; cursor: grab; z-index: 30; touch-action: none; }
.servedSet.draggable:active { cursor: grabbing; }
.servedSet.hintBob { animation: hintBob 1s ease-in-out infinite; }
@keyframes hintBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7%); } }
/* wrong delivery (drink given to the wrong client): no red glow — the drink snaps back
   and gives a gentle wiggle as soft "try again" feedback */
.servedSet.wiggle { animation: servedWiggle 0.5s ease; }
@keyframes servedWiggle {
  0%,100% { transform: translate(0,0) rotate(0deg);  }
  15%     { transform: translate(-5%,0) rotate(-5deg); }
  30%     { transform: translate(5%,0)  rotate(5deg);  }
  45%     { transform: translate(-4%,0) rotate(-4deg); }
  60%     { transform: translate(4%,0)  rotate(3deg);  }
  75%     { transform: translate(-2%,0) rotate(-1.5deg); }
}

/* drag hint: a faint clone of the finished glass drifts toward the customer,
   showing the drink being "guided forward" (replaces the hand gesture) */
.servedSet.dragGhost {
  pointer-events: none;
  z-index: 11;                 /* just behind the real, grabbable glass (z30) */
  filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
  animation: dragGhost 2.2s ease-in-out infinite;
  will-change: transform, opacity;
}
/* --gdx/--gdy = the full tray→customer journey, measured live in showDragGhost()
   so the ghost always travels ALL the way to the customer's table before fading */
@keyframes dragGhost {
  0%       { transform: translate(0,0) scale(1); opacity: 0; }
  10%      { transform: translate(calc(var(--gdx,-100%) * 0.08), calc(var(--gdy,-230%) * 0.08)) scale(0.97); opacity: 0.55; }
  80%      { transform: translate(calc(var(--gdx,-100%) * 0.9),  calc(var(--gdy,-230%) * 0.9))  scale(0.8);  opacity: 0.45; }
  95%,100% { transform: translate(var(--gdx,-100%), var(--gdy,-230%)) scale(0.75); opacity: 0; }
}

/* drag hint for the FILLED machine glass: a faint clone drifts from the machine to the
   tray on a loop, showing where to drop it (replaces the hand nudge on this step).
   --ggx/--ggy = the full machine→tray journey, measured live in showGlassGhost() */
.glassGhost {
  position: absolute;
  left: 20.24%;
  top: 76.79%;
  width: 6.7%;
  height: 15.2%;
  z-index: 9;                  /* above the counter, below the dragged glass (z40) */
  pointer-events: none;
  opacity: 0;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
  animation: glassGhostDrift 2.2s ease-in-out infinite;
  will-change: transform, opacity;
}
@keyframes glassGhostDrift {
  0%       { transform: translate(0,0) scale(1); opacity: 0; }
  10%      { transform: translate(calc(var(--ggx,300%) * 0.08), calc(var(--ggy,-30%) * 0.08)) scale(0.98); opacity: 0.55; }
  80%      { transform: translate(calc(var(--ggx,300%) * 0.9),  calc(var(--ggy,-30%) * 0.9))  scale(0.85); opacity: 0.45; }
  95%,100% { transform: translate(var(--ggx,300%), var(--ggy,-30%)) scale(0.8); opacity: 0; }
}

/* ── juice stream (nozzle → glass) — flowing liquid column ── */
#stream {
  position: absolute;
  left: 23.59%;       /* aligned to the spout center */
  transform: translateX(-50%);
  top: 74%;
  width: 0.58%;
  height: 16%;
  background: linear-gradient(180deg, rgba(247,122,222,0) 0%, #F77ADE 22%, #F77ADE 100%);
  border-radius: 0 0 50% 50% / 0 0 14% 14%;
  opacity: 0;
  z-index: 9;
  pointer-events: none;
  transform-origin: top center;
}
/* one smooth, gentle pour — fade + grow, no wobble */
#stream.pouring { animation: streamPour 0.9s cubic-bezier(0.33, 0, 0.2, 1) both; }
@keyframes streamPour {
  0%   { opacity: 0; transform: translateX(-50%) scaleY(0.25); }
  30%  { opacity: 1; transform: translateX(-50%) scaleY(1);    }
  75%  { opacity: 1; transform: translateX(-50%) scaleY(1);    }
  100% { opacity: 0; transform: translateX(-50%) scaleY(1);    }
}

/* splash droplets where the stream hits the juice (same #F77ADE) */
.splash {
  position: absolute;
  background: #F77ADE;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9;
  animation: splashUp 0.55s cubic-bezier(0.33, 0, 0.2, 1) forwards;
}
@keyframes splashUp {
  0%   { transform: translate(0,0)               scale(0.5); opacity: 0.95; }
  60%  { opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
}

/* ── counter props ── */
#strawBox {
  position: absolute;
  left: 45.5%;
  top: 57.3%;
  width: 15.9%;
  z-index: 7;
  pointer-events: none;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,0.35));
  transition: transform 0.15s;
}
/* straw box pulses to invite a tap once the glass is served */
#strawBox.glow {
  cursor: pointer;
  animation: boxGlow 0.9s ease-in-out infinite;
}
#strawBox.glow:hover { transform: scale(1.08); }
@keyframes boxGlow {
  0%,100% { filter: drop-shadow(0 8px 12px rgba(0,0,0,0.35)) drop-shadow(0 0 0 rgba(255,215,0,0));    transform: scale(1);    }
  50%     { filter: drop-shadow(0 8px 12px rgba(0,0,0,0.35)) drop-shadow(0 0 20px rgba(255,215,0,0.95)); transform: scale(1.06); }
}
/* a straw that drops into the served glass (positioned within the .servedSet) */
/* a straw that flies from the straw box into the glass */
.flyStraw {
  position: absolute;
  width: 5.5%;
  pointer-events: none;
  z-index: 25;
  transform: translate(-50%,-50%);
  transition: left 0.2s ease-in, top 0.2s ease-in, transform 0.2s ease-in;   /* fast fly to glass */
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35));
}
.servedSet .strawImg {
  position: absolute;
  left: 50%;         /* centered in the glass (was off to the left → poked out the side) */
  top: 2%;           /* dips into the glass; only the top pokes above the rim */
  height: 74%;       /* short enough to sit inside, not tower over the rim */
  pointer-events: none;
  transform-origin: center bottom;   /* pivots at its base, planted in the glass */
  animation: strawDrop 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes strawDrop {
  0%   { transform: translateX(-50%) translateY(-30%) rotate(-10deg); opacity: 0; }
  100% { transform: translateX(-50%) translateY(0)    rotate(-6deg);  opacity: 1; }  /* near-upright, sitting inside */
}
/* full glass composites (straw, then straw+lemon) shown on a full glass.
   Sized by HEIGHT so the glass stays the same size across both SVGs. */
.servedSet .fullStrawImg,
.servedSet .fullLemonImg,
.servedSet .halfGlassImg,
.servedSet .compositeImg {
  position: absolute;
  left: 50%;
  /* --comp-h/--comp-b/--comp-cx are set per artwork (see COMPOSITE_POS in the JS)
     so the GLASS inside each composite lands exactly on the plain glass footprint —
     the glass must not move when a straw/lemon is added */
  bottom: var(--comp-b, 0);
  transform: translateX(var(--comp-cx, -50%));
  height: var(--comp-h, 135%);
  width: auto;
  pointer-events: none;
  transform-origin: center bottom;
  animation: fullStrawIn 0.2s cubic-bezier(0.34,1.56,0.64,1);   /* quick, snappy pop-in */
}
@keyframes fullStrawIn {
  0%   { opacity: 0; transform: translateX(var(--comp-cx, -50%)) translateY(-6%) scale(0.97); }
  100% { opacity: 1; transform: translateX(var(--comp-cx, -50%)) translateY(0)    scale(1);   }
}
#lemonBox {
  position: absolute;
  left: 59.9%;
  top: 55.1%;
  width: 22.3%;
  z-index: 7;
  pointer-events: none;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,0.35));
  transition: transform 0.15s;
}
/* lemon box pulses to invite a tap after the straw is added */
#lemonBox.glow {
  cursor: pointer;
  animation: boxGlow 0.9s ease-in-out infinite;
}
#lemonBox.glow:hover { transform: scale(1.06); }
/* while the glass is on the tray the boxes are tappable (pointer-events:auto) →
   hovering one makes it pulse slightly. (:not(.glow) so it doesn't clash with the tutorial glow.) */
#strawBox:not(.glow):hover, #lemonBox:not(.glow):hover {
  cursor: pointer;
  animation: boxHoverPulse 0.7s ease-in-out infinite;
}
@keyframes boxHoverPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
/* a lemon slice that drops onto the served glass rim (within the .servedSet) */
.servedSet .lemonImg {
  position: absolute;
  left: -33%;
  top: -20%;
  width: 69%;
  pointer-events: none;
  transform-origin: center;
  animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
#tray {
  position: absolute;
  left: 43.6%;
  top: 64.4%;
  width: 37.1%;
  z-index: 8;
  pointer-events: none;
  filter: drop-shadow(0 8px 14px rgba(0,0,0,0.4));
}
/* the tray glows gently while it is the drop target for the filled glass */
#tray.glow { animation: trayGlow 1.4s ease-in-out infinite; }
@keyframes trayGlow {
  0%,100% { filter: drop-shadow(0 8px 14px rgba(0,0,0,0.4))
                    drop-shadow(0 0 6px rgba(255,215,0,0.35)); }
  50%     { filter: drop-shadow(0 8px 14px rgba(0,0,0,0.4))
                    drop-shadow(0 0 20px rgba(255,215,0,0.9))
                    drop-shadow(0 0 34px rgba(255,190,80,0.55)); }
}

/* ── coin reward (coins.svg pile placed on the counter) ── */
#coinPile {
  position: absolute;
  left: 44%; top: 48%;               /* fixed spot on the counter ledge (matches reference) */
  transform: translate(-50%, -50%);
  width: 4.5%;
  z-index: 44;
  pointer-events: none;
  display: none;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35)) drop-shadow(0 0 14px rgba(255,215,0,0.85));
}
/* magical materialise as the coins appear */
#coinPile.landIn { animation: coinLand 0.45s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes coinLand {
  0%   { transform: translate(-50%,-50%) scale(0.4);  opacity: 0; }
  55%  { transform: translate(-50%,-50%) scale(1.14); opacity: 1; }
  100% { transform: translate(-50%,-50%) scale(1);    opacity: 1; }
}
/* smooth magical fade-out (float up + dissolve) */
#coinPile.fadeOut { animation: coinFade 0.7s ease forwards; }
@keyframes coinFade {
  0%   { transform: translate(-50%,-50%) scale(1);   opacity: 1; }
  100% { transform: translate(-50%,-95%) scale(1.1); opacity: 0; }
}

/* ── reward stars: a soft glowing twinkle burst over the served glass on a correct answer ── */
.star {
  position: absolute;
  z-index: 55;
  pointer-events: none;
  filter: drop-shadow(0 0 5px rgba(255,236,160,.95))
          drop-shadow(0 0 13px rgba(255,190,80,.6))
          drop-shadow(0 0 26px rgba(255,150,40,.35));   /* warm bloom, soft on the eyes */
  will-change: transform, opacity;
}

/* ── POUR button (transparent hit-area over the machine's POUR circle) ── */
#pourBtn {
  position: absolute;
  left: 20.3%;
  top: 55.7%;
  width: 6%;
  aspect-ratio: 0.5;
  background: url('new assets/main bg/pour buttone.webp') no-repeat center / contain;
  border: none;
  cursor: pointer;
  z-index: 12;
  transition: transform 0.08s ease, filter 0.08s ease;
}
/* (the golden ready-glow — a pulsing drop-shadow halo behind the button — has been removed
   along with its @keyframes pourReady. The button now sits flat against the machine art in
   every state; nothing glows behind it.) */
/* press feedback — the button presses in: shrinks and darkens (image stays visible, no glow) */
#pourBtn:not(:disabled):active,
#pourBtn.pressed {
  transform: scale(0.9);
  filter: brightness(0.82);
}
/* Disabled POUR (glass already full, or locked while the dragon speaks).
   Kept CRISP: there is no blur and no transform. The old scale(0.96) was the real culprit —
   a fractional downscale resamples the bitmap artwork, which softened the POUR text, the
   outline and the highlights; heavy brightness(0.62) + opacity 0.55 washed out what was
   left. "Not tappable" now reads from a light desaturation/dim plus 85% opacity, so every
   edge stays at its native size and full sharpness. */
#pourBtn:disabled {
  cursor: default;
  pointer-events: none;                /* no hover/active feedback either */
  filter: saturate(0.8) brightness(0.9);
  opacity: 0.85;
}
/* pointer-driven game buttons: no browser focus ring — shift+click / keyboard-style
   activation otherwise draws a rectangle around the button's (invisible) box */
#pourBtn:focus, #pourBtn:focus-visible,
#checkBtn:focus, #checkBtn:focus-visible { outline: none; }

@keyframes pulseRing {
  0%   { transform: scale(0.85); opacity: 0.9; }
  100% { transform: scale(1.5);  opacity: 0;   }
}
.pulse-ring {

  inset: 0;
  border-radius: 50%;

}

/* ── hand tutorial pointer ── */
#hand {
  position: absolute;
  width: 4cqw;
  height: auto;
  z-index: 30;
  pointer-events: none;

  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
  animation: tapHand 1s ease-in-out infinite;
}
@keyframes tapHand {

}

/* drag-gesture hint: hand sweeps up-right toward the customer */
#hand.dragHint { animation: dragHint 1.5s ease-in-out infinite; }

  15%  { transform: translate(0, 0)        scale(0.85); }
  60%  { transform: translate(180%, -150%) scale(0.85); }
  100% { transform: translate(180%, -150%) scale(1);    }
}

/* (the old #banner / #bannerBg / #bannerText instruction box was replaced by the dragon's
   speech bubble — its rules had no matching markup or JS and have been removed) */

/* ── Check button REMOVED — the player now drags the filled glass onto the tray.
   Kept in the DOM (some code still toggles its style) but never shown. ── */
#checkBtn {
  position: absolute;
  left: 57.5%;
  top: 86.5%;
  width: 9.3%;
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
  z-index: 13;
  display: none !important;   /* the tap-to-check button is gone; dragging replaces it */
  transition: transform 0.12s, filter 0.12s, opacity 0.3s;
}
/* the filled machine glass becomes grabbable so it can be dragged onto the tray */
#glass.grabbable { pointer-events: auto; cursor: grab; touch-action: none; }
#glass.grabbable:active { cursor: grabbing; }
/* while a drink is out being served the slot is empty; a fresh glass re-appears
   (drops into the slot) the moment the reward coins vanish */
#glass.gone { opacity: 0; pointer-events: none; }
#glass.appearIn { transform-origin: center bottom; animation: glassAppear 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes glassAppear {
  0%   { opacity: 0; transform: translateY(-10%) scale(0.7); }
  60%  { opacity: 1; }
  100% { opacity: 1; transform: translateY(0)   scale(1);   }
}
/* while being dragged, lift it above the tray (z8) and straw/lemon boxes (z7) so it
   doesn't slide behind them */
#glass.dragging { z-index: 40; }
#checkBtn img { width: 100%; display: block; }
#checkBtn:not(:disabled):hover { transform: scale(1.07); filter: brightness(1.12); }
#checkBtn:not(:disabled):active { transform: scale(0.95); }
#checkBtn:disabled { opacity: 0.4; cursor: default; }

/* ── Next / Play-again button ── */
/* (#nextBtn and its startPulse keyframes removed — no matching markup or JS) */

/* ── game-over screen (after the full customer cycle: 5 half + 5 full) ── */
#gameEnd {

  z-index: 60;
  display: none;
}
#gameEnd.show { display: block; }
/* the "Perfect Pour — complete" backdrop fills the frame (shows while the video loads) */
#endBg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* the celebration video fills the frame and fades in over the backdrop */
#endVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#gameEnd.show #endVideo { animation: endVideoIn 0.5s ease both; }
@keyframes endVideoIn {
  0%   { opacity: 0; }
  100% { opacity: 1; }
}
/* confetti layer sits above the video (pieces are created/positioned in JS) */
#confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
.confettiPiece {
  position: absolute;
  top: -8%;
  width: 1.1%;

  will-change: transform, opacity;

}
@keyframes confettiFall {

#title {

}
@keyframes popThumb {

  100% { transform: scale(1);   opacity: 1; }
}
.playBtn {
  position: absolute;          /* placed at the spot set in the debug overlay */
  left: 41.5%;
  top: 67.56%;
  width: 17%;
  height: auto;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  animation: playPulse 1.2s ease-in-out infinite;
}
/* â”€â”€ boot preloader â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
   Play is HIDDEN until every asset is fetched; a themed bar sits in its place and the
   button pops in at 100%. leaveTitle() is guarded too, so keyboard / programmatic
   starts also wait. */
#playBtn { visibility: hidden; }
#playBtn.ready {

  animation: playPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both,
             playPulse 1.2s ease-in-out 0.5s infinite;

@keyframes playPop {

}
#loadWrap {

  left: 50%; top: 71.5%;
  transform: translateX(-50%);
  width: 34%;
  z-index: 71;
  display: flex; flex-direction: column; align-items: center;
  gap: 1.3cqw;
  transition: opacity 0.4s ease;
}
#loadWrap.done { opacity: 0; pointer-events: none; }
#loadTrack {
  width: 100%; height: 2.4cqw;
  border-radius: 999px;
  background: rgba(24,8,36,0.55);

  box-shadow: 0 0.5cqw 1.2cqw rgba(0,0,0,0.45);
}
#loadFill {
  height: 100%; width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, #B8156F, #F77ADE 62%, #FF9EDD);
  box-shadow: 0 0 1.2cqw rgba(247,122,222,0.85);
  transition: width 0.25s ease;
}
#loadPct {
  font-family: 'Poppins', system-ui, sans-serif;   /* Baloo 2 is never loaded — use the real font */
  font-weight: 800;
  font-size: 2cqw;
  color: #fff;
  letter-spacing: 0.06em;
  text-shadow: 0 0.22cqw 0 #B8156F, 0 0.4cqw 1cqw rgba(0,0,0,0.6);
}
/* soft grounding shadow + a warm golden halo that breathes with the scale pulse */
@keyframes playPulse {
  0%,100% {
    transform: scale(1);
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.35))
            drop-shadow(0 0 10px rgba(255,214,110,0.35));
  }
  50% {

    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3))

@keyframes introOut { 0% { opacity: 1; } 100% { opacity: 0; } }

/* ── roller shutter transition (title → game) ── */
#shutter {
  position: absolute;
  inset: 0;
  z-index: 80;                 /* above the title (z70) */
  display: none;
  transform: translateY(-100%);
  pointer-events: none;
  background: repeating-linear-gradient(to bottom,
      #6a7079 0px, #6a7079 15px,
      #474c54 15px, #474c54 19px);
  box-shadow: inset 0 0 40px rgba(0,0,0,0.35);

  position: absolute;
  left: 0; right: 0; bottom: 0;

/* ── pause screen ──────────────────────────────────────────────
   Shown automatically when the tab/window goes inactive; the player resumes by hand.
   z90 sits above every gameplay layer (z≤44), the title (z70) and the splash wipe (z85),
   and below the dev menu (z99999). It covers the whole board, so while it is up nothing
   underneath can be tapped or dragged. */
#pauseScreen {
  position: absolute; inset: 0;
  z-index: 90;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(24, 8, 36, 0.62);        /* dim the board, still readable underneath */
  cursor: default;
}
#pauseScreen.show { display: flex; animation: pauseFade 0.22s ease both; }
@keyframes pauseFade { from { opacity: 0; } to { opacity: 1; } }
#pausePanel {
  display: flex; flex-direction: column; align-items: center;
  gap: 1.6cqw;
  animation: pausePop 0.28s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes pausePop {
  0%   { transform: scale(0.82); opacity: 0; }
  100% { transform: scale(1);    opacity: 1; }
}
#pauseTitle {
  font-family: 'Poppins', system-ui, sans-serif;
  font-weight: 800;
  font-size: 5.6cqw;
  letter-spacing: 0.1em;
  color: #fff;
  text-shadow: 0 0.35cqw 0 #B8156F, 0 0.7cqw 1.6cqw rgba(0,0,0,0.65);
}
#resumeBtn {
  width: 13cqw;                                     /* sized off the board, like the Play button */
  height: auto;
  cursor: pointer;
  animation: playPulse 1.2s ease-in-out infinite;   /* same breathing glow as the Play button */
}
#pauseHint {
  font-family: 'Poppins', system-ui, sans-serif;
  font-weight: 700;
  font-size: 1.7cqw;
  color: rgba(255,255,255,0.9);
  text-shadow: 0 0.2cqw 0.6cqw rgba(0,0,0,0.7);
}
/* While paused, every CSS animation on the board freezes on its current frame (character
   walk-ins, glows, bobs, confetti…). The pause screen itself is exempt — the two-id
   selectors below outrank the freeze rule, so its own pop-in and glow still play. */
#gc.paused *:not(#pauseScreen) { animation-play-state: paused !important; }
#gc.paused #pauseScreen,
#gc.paused #pauseScreen * { animation-play-state: running !important; }

/* ── juice splash transition (fires when the tutorial dragon leaves) ──
   a pink juice splat bursts from the centre to swallow the scene, droplets spray
   out, then two pink waves drain off the bottom to reveal the new scene. */
#splash {
  position: absolute; inset: 0;
  z-index: 85;                 /* above gameplay (z≤44), below the dev menu (z99999) */
  display: none;
  overflow: hidden;
  pointer-events: none;
}
#splash.run { display: block; }
/* the burst blob (splash.svg) — bursts from the centre; JS scales it up to cover */
#splat {
  position: absolute;
  left: 50%; top: 50%;
  width: 46%;                  /* base size — scaled up in JS to swallow the board */
  aspect-ratio: 1035 / 1020;   /* matches splash.svg's native size */
  transform: translate(-50%,-50%) scale(0);
  opacity: 0;
  will-change: transform, opacity;
}
/* full-width pink waves — parked above the board, they drain down through it */
.wave {
  position: absolute; left: 0; top: 0;
  width: 100%; height: 132%;
  transform: translateY(-135%);   /* parked out of sight until the drain */
  will-change: transform;
}
.wave svg { width: 100%; height: 100%; display: block; }
/* droplets that spray ahead of the splat's expanding edge (positioned in JS) */
.splash-drop {
  position: absolute;
  left: 0; top: 0;
  border-radius: 50%;
  background: #F77ADE;
  pointer-events: none;
  opacity: 0;
  will-change: transform, opacity;
}

// The whole game flow is driven by setTimeout/setInterval — narration beats, walk-ins,

// every one of them is routed through this registry. On pause the native timer is cancelled
// and the time it had LEFT is remembered; on resume it is re-armed with exactly that much
// remaining. Nothing is skipped, nothing double-fires, and the game comes back mid-beat
// exactly where it stopped. Installed before any other code so every call site is covered
// (the wrappers are transparent while the game is running).
const NATIVE_TIMERS = {
  setTimeout:    window.setTimeout.bind(window),
  clearTimeout:  window.clearTimeout.bind(window),
  setInterval:   window.setInterval.bind(window),
  clearInterval: window.clearInterval.bind(window)
};
const heldTimers = new Map();      // our id → record
let timerSeq = 0, timersHeld = false;
let gamePaused = false;            // true while the pause screen is up (see pauseGame below)
function armHeldTimer(rec) {
  rec.startedAt = performance.now();
  rec.handle = NATIVE_TIMERS.setTimeout(() => {
    if (rec.repeat) { rec.left = rec.delay; armHeldTimer(rec); }   // interval → re-arm
    else heldTimers.delete(rec.id);
    try { rec.fn.apply(null, rec.args); } catch (e) {}
  }, rec.left);
}
function addHeldTimer(fn, delay, args, repeat) {
  if (typeof fn !== 'function') return 0;        // the string-eval form is never used here
  const d = Math.max(0, delay || 0);

      try { titleMusic.pause(); titleMusic.currentTime = 0; } catch (e) {}
      titleMusic.volume = TITLE_MUSIC_VOL;

}

// ── gameplay music (starts when Play is tapped; loops through the game) ──
const gameMusic = regAudio('sxf/an sfx.ogg');

// ── dialogue voice-over ───────────────────────────────────────
// Each dialogue line maps to a recording in /audio (filename = the line text).
// Lines are queued: a line's text + narration show together, and the NEXT line
// only appears once the current line's audio has completely finished playing.
// key = the exact line the game speaks; value = the clip's filename in /audio (no .ogg).
// Only lines that have a recording are listed — any line not here just shows silently.
const VOICE = {
  'Welcome to the Spooky Juice Stall!':     'Welcome to the Spooky Juice Stall!',
  'The customers will be arriving soon!':   'The customers will be arriving soon!',
  'Look! Our first customer.':              'Look! Our first customer',
  'Let us serve him.':                      'Let us serve him',
  'Tap the button to pour juice.':          'Tap the button to pour juice',
  'The glass is now full.':                 'The glass is now full',
  'The glass is now half full.':            'The glass is now half full',
  'The glass is now half full. Drag the glass to the tray.': 'The glass is now half full',  // combined line → announce the state
  'Drag the glass to the tray.':            'Drag the glass to the tray',
  'Drag the juice to the customer.':        'Drag the juice to the customer',
  'Now, it is your turn!':                  'Now, it is your turn!',
  'Tap the Pour button 2 times.':           'Tap the Pour button 2 times',
  'Tap the Pour button 4 times.':           'Tap the Pour button 4 times'
};
// preload one Audio per unique clip
const voiceClips = {};
Object.keys(VOICE).forEach(line => {
  const file = VOICE[line];
  if (!voiceClips[file]) {
    const a = regAudio('audio/' + encodeURIComponent(file) + '.ogg');
    // preload stays 'none' (regAudio): the preloader streams it and swaps in a blob
    voiceClips[file] = a;
  }
});
// Dialogue queue: a line stays on screen with its narration until the audio has
// COMPLETELY finished. Only then does the next queued line appear and its audio
// start — so the text and the voice always advance together, never overlapping.
let voiceQueue   = [];
let voiceBusy    = false;
let currentVoice = null;
let voiceFallback = null;
let voiceAdvance = null;   // ends the line currently on screen (see finishCurrentLine)
// ── dragon typewriter ────────────────────────────────────────
// Reveal the line one character at a time, with a blinking caret and a soft
// click per keystroke. The not-yet-typed tail is kept in the layout (invisible)
// so the bubble reserves its final size from the first char and never resizes.
let typeTimer = null;
function stopTyping() {
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
}
// words/phrases to emphasise (bold) inside the dragon's bubble
const DRAGON_BOLD = ['empty glass', 'half full', 'full'];
function dragonBoldMask(chars) {
  const lower = chars.map(c => c.toLowerCase());
  const bold = new Array(chars.length).fill(false);
  DRAGON_BOLD.forEach(phrase => {
    const p = Array.from(phrase.toLowerCase());
    for (let i = 0; i + p.length <= chars.length; i++) {
      let ok = true;
      for (let j = 0; j < p.length; j++) if (lower[i + j] !== p[j]) { ok = false; break; }
      if (ok) for (let j = 0; j < p.length; j++) bold[i + j] = true;
    }
  });
  return bold;
}
// append chars[start..end) into `parent`, wrapping bold runs in <b> (so the
// invisible tail reserves the same width the bold text will take once typed)
function appendDragonRuns(parent, chars, bold, start, end) {
  let k = start;
  while (k < end) {
    const b = bold[k]; let j = k;
    while (j < end && bold[j] === b) j++;
    const txt = chars.slice(k, j).join('');
    if (b) { const el = document.createElement('b'); el.textContent = txt; parent.appendChild(el); }
    else   { parent.appendChild(document.createTextNode(txt)); }
    k = j;
  }
}
// How slowly the dragon "speaks": ms per character. Higher = slower, calmer reveal.
const TYPE_MS = 135;
// `maxMs` (optional) = how long the line will stay up (its voice clip's length). The reveal
// is sped up only if the slow pace wouldn't finish in time, so text is never cut off.
function typeDragon(text, maxMs) {
  stopTyping();
  if (!bannerTxt) return;
  const chars = Array.from(text || '');     // split by code point so emoji aren't broken mid-type
  const bold  = dragonBoldMask(chars);
  bannerTxt.classList.add('typing');         // blinking caret on (see #dragonText.typing::after)
  let i = 0;
  const render = () => {
    bannerTxt.textContent = '';
    appendDragonRuns(bannerTxt, chars, bold, 0, i);          // typed (visible)
    if (i < chars.length) {
      const tail = document.createElement('span');
      tail.className = 'untyped';            // not-yet-typed (invisible, reserves space)
      appendDragonRuns(tail, chars, bold, i, chars.length);
      bannerTxt.appendChild(tail);
    }
  };
  render();
  // pace: the slow default, unless the narration is shorter — then fit the reveal inside it
  // (finishing at ~85% of the clip) so the sentence is always complete before it advances
  let delay = TYPE_MS;
  if (maxMs && chars.length) delay = Math.min(delay, Math.max(30, (maxMs * 0.85) / chars.length));
  typeTimer = setInterval(() => {
    i++;
    render();
    if (i >= chars.length) {
      stopTyping();
      bannerTxt.classList.remove('typing');         // line fully typed → caret disappears
    }

}
// these "keep pouring" lines show NO dialogue box — just a hand nudge on the POUR button
const HAND_ONLY = {
  'Keep pouring!': true,
  'Tap again!': true,
  'Tap again to pour more juice.': true
};

// these lines play their narration with NO dialogue box (cues/hand still work)
const NO_BOX = {
  'Tap on the straws.': true,
  'Tap on the lemons.': true
};

// ── tutorial opening: a short beat before each box appears ────
// The first five tutorial lines used to snap straight from one box to the next. Each of
// these now waits 0.3s before it starts, with the bubble hidden for that beat, so it fades
// in fresh (the existing 0.25s bubbleFade) instead of the text just swapping underneath.
// The whole line — box, typewriter and narration — starts together 0.3s late; nothing about
// the lines themselves changes. This list ENDS at the pour instruction: every dialogue box
// after "Tap the button to pour juice." behaves exactly as before.
const GENTLE_INTRO_MS = 300;
const GENTLE_INTRO = {
  'Welcome to the Spooky Juice Stall!':   true,
  'The customers will be arriving soon!': true,
  'Look! Our first customer.':            true,
  'Let us serve him.':                    true,
  'Tap the button to pour juice.':        true   // ← last line with the beat; stop here
};
let gentleTimer = null;

// silent lines (no recording) / playback failures linger for a readable beat — long enough
// for the slow typewriter to finish the whole sentence, plus a moment to read it
function estimateDuration(text) {
  const len = text ? text.length : 0;
  return Math.min(9500, Math.max(2400, len * TYPE_MS + 800));
}

function enqueueDialogue(text, onDone, onEnd) {
  voiceQueue.push({ text: text, onDone: onDone, onEnd: onEnd });
  pumpDialogue();
}

function pumpDialogue() {
  refreshGlassGrab();                       // dialogue state changed → re-gate the glass
  if (gamePaused) return;                   // paused → no line starts; resumeGame() pumps again
                                            // (DOM events still fire while paused, so a glide
                                            //  finishing behind the pause screen must not talk)
  if (voiceBusy) return;                    // a line is still narrating — wait for it
  if (dragonMoving) return;                 // dragon still gliding — no box appears mid-move
                                            // (endDragonMove pumps again once it lands)
  const item = voiceQueue.shift();
  if (!item) { refreshGlassGrab(); return; }  // queue drained → the glass may unlock
  voiceBusy = true;

  // 0.3s beat before this box appears (tutorial opening lines only — see GENTLE_INTRO).
  // The item goes back at the head of the queue and voiceBusy is held so nothing else can
  // start; when the beat passes, the line runs through this function exactly as it normally
  // would. Only the start is postponed — no text, pacing or callback order changes.
  if (!item.beat && tutorial && GENTLE_INTRO[item.text]) {
    item.beat = true;
    voiceQueue.unshift(item);
    if (bannerEl) bannerEl.classList.remove('show');   // hidden for the beat → fades back in
    if (gentleTimer) clearTimeout(gentleTimer);
    gentleTimer = setTimeout(() => {
      gentleTimer = null;
      voiceBusy = false;
      pumpDialogue();
    }, GENTLE_INTRO_MS);
    return;
  }

  // resolve the narration first, so the typewriter can pace itself to the clip's length
  const file = (dragonGone || skipDialogue) ? null : VOICE[item.text];
  const clip = file ? voiceClips[file] : null;
  const clipMs = (clip && isFinite(clip.duration) && clip.duration > 0) ? clip.duration * 1000 : 0;

  // show this line now (once the dragon host has left, no bubble/voice appears)
  if (!dragonGone) {
    if (HAND_ONLY[item.text]) {
      // "keep pouring" prompts: no box — just nudge the POUR button while the dragon speaks
      stopTyping();
      if (bannerEl) bannerEl.classList.remove('show');
      showPourHand();
    } else if (NO_BOX[item.text]) {
      // box-less narration: the dragon speaks with no dialogue box; cues (glow/hand)
      // attached to the line still work via the boxlessLine flag in cueVisible()
      stopTyping();
      if (bannerEl) bannerEl.classList.remove('show');
      hideHand();
      boxlessLine = true;
    } else {
      if (bannerEl)  bannerEl.classList.add('show');
      if (bannerTxt) {
        if (skipDialogue) { stopTyping(); bannerTxt.classList.remove('typing'); bannerTxt.textContent = item.text; }
        else              typeDragon(item.text, clipMs);   // typewriter reveal, paced to the narration
      }
      hideHand();                            // a normal box line — clear any leftover pour hand
    }
    dragonTalk(true);                        // dragon animates while it's saying the line
  }
  if (item.onDone) item.onDone();           // keep gameplay chains/setup running

  // advance to the next line — fired once, when this line's audio truly ends
  let advanced = false;
  const advance = () => {
    if (advanced) return;
    advanced = true;
    voiceAdvance = null;
    if (voiceFallback) { clearTimeout(voiceFallback); voiceFallback = null; }
    if (currentVoice) { try { currentVoice.onended = null; } catch (e) {} currentVoice = null; }
    dragonTalk(false);                      // stopped talking — freeze the dragon
    boxlessLine = false;                    // box-less line over — cues need a visible box again
    if (item.onEnd) item.onEnd();           // this line's audio has fully finished
    voiceBusy = false;
    pumpDialogue();
  };
  voiceAdvance = advance;                     // lets finishCurrentLine() end this line early

  if (clip) {                                 // (file/clip resolved at the top of this function)
    currentVoice = clip;
    clip.onended = advance;                 // ← the next line waits for THIS to fire
    // safety net so a missing 'ended' event can never freeze the dialogue forever
    const safety = (isFinite(clip.duration) && clip.duration > 0) ? clip.duration * 1000 + 800 : 12000;
    voiceFallback = setTimeout(advance, safety);
    try {
      clip.currentTime = 0;
      const p = clip.play();
      if (p) p.catch(() => {                 // autoplay blocked / error — fall back to a timer
        if (!advanced) { clearTimeout(voiceFallback); voiceFallback = setTimeout(advance, estimateDuration(item.text)); }
      });
    } catch (e) {
      clearTimeout(voiceFallback); voiceFallback = setTimeout(advance, estimateDuration(item.text));
    }
  } else {
    voiceFallback = setTimeout(advance, skipDialogue ? 50 : estimateDuration(item.text));  // silent line — timed (dev skip → near-instant)
  }
}

// The player has already DONE what the line on screen asked for, so the rest of its reading
// hold is dead time holding the next instruction back. This ends it now: the line's onEnd
// still runs and the queue moves on in order, so nothing is skipped. It refuses to act while
// a recording is playing, so narration is never cut off mid-sentence — only the timed hold of
// a silent prompt (like the box-less "Tap on the lemons.") is released early.
function finishCurrentLine() {
  if (currentVoice) return;                   // a voice clip is playing → let it finish
  if (voiceAdvance) voiceAdvance();
}

// True while the dragon is mid-sentence OR still has lines queued behind it. Interactions
// that are NOT the action the current line is asking for must be ignored until this clears,
// so nothing the player taps can cut the narration short. Once the dragon has left there is
// no narration to protect, so nothing blocks (pair mode runs lines silently).
function dialogueBlocking() {
  return !dragonGone && (voiceBusy || voiceQueue.length > 0);
}

// drop any pending/playing narration (used on round reset)
function clearVoiceQueue() {
  voiceQueue = [];
  voiceBusy  = false;
  boxlessLine = false;
  stopTyping();                      // abort any in-progress typewriter reveal
  voiceAdvance = null;
  if (gentleTimer) { clearTimeout(gentleTimer); gentleTimer = null; }   // drop a pending 0.3s beat
  resetDragonMove();                 // …and any dragon-move gate, so the queue is never held shut
  if (voiceFallback) { clearTimeout(voiceFallback); voiceFallback = null; }
  if (currentVoice) {
    try { currentVoice.onended = null; currentVoice.pause(); currentVoice.currentTime = 0; } catch (e) {}
    currentVoice = null;
  }
  dragonTalk(false);                 // stopped talking — freeze the dragon
  refreshGlassGrab();                // nothing narrating any more → the glass may unlock
}

// ── dragon animation: the GIF only plays while the dragon is speaking ──
// An animated webp can't be paused, so when idle we draw the CURRENT frame onto
// a canvas placed over the dragon and hide the live image. We only DRAW to the
// canvas (never read it), so this also works when the page runs from file://.
let dragonTalking = true, dragonFreezeCv = null;
function freezeDragon() {
  if (!dragonEl || dragonGone || !dragonEl.naturalWidth) return;
  const r = dragonEl.getBoundingClientRect(), fr = gcEl.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return;
  if (!dragonFreezeCv) {
    dragonFreezeCv = document.createElement('canvas');
    dragonFreezeCv.style.position = 'absolute';
    dragonFreezeCv.style.pointerEvents = 'none';
    gcEl.appendChild(dragonFreezeCv);
  }
  const cv = dragonFreezeCv;
  cv.width = Math.round(r.width); cv.height = Math.round(r.height);
  const iw = dragonEl.naturalWidth, ih = dragonEl.naturalHeight;
  const s = Math.min(r.width / iw, r.height / ih);     // replicate object-fit: contain
  const dw = iw * s, dh = ih * s;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  try { ctx.drawImage(dragonEl, (r.width - dw) / 2, (r.height - dh) / 2, dw, dh); } catch (e) { return; }
  cv.style.left = (r.left - fr.left) + 'px'; cv.style.top = (r.top - fr.top) + 'px';
  cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  cv.style.zIndex = 9; cv.style.display = 'block';
